<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amigo de Qualidade</title>
<style>
:root{--navy:#173b63;--blue:#245b91;--bg:#f2f5f9;--ink:#1c2733;--muted:#667789;--line:#dce3eb;--green:#16865d;--red:#c33d45}
*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:10px 14px;background:var(--blue);color:white;font-weight:600}button.secondary{background:#e7edf4;color:#24415e}button.danger{background:var(--red)}button.success{background:var(--green)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;background:#fff;color:#17212b}label{display:block;font-weight:600;margin:9px 0 5px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{background:white;width:min(420px,100%);padding:30px;border-radius:15px;box-shadow:0 12px 45px #1c35551c}.brand{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:5px}.muted{color:var(--muted)}.login button{width:100%;margin-top:16px}
#app{display:none;min-height:100vh}.top{height:62px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.top strong{font-size:18px;letter-spacing:.3px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 62px)}
nav{background:#fff;border-right:1px solid var(--line);padding:15px 10px}nav button{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;color:#35485b;font-weight:600}nav button.active,nav button:hover{background:#e9f1fa;color:var(--navy)}main{padding:22px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}.pagehead h1{font-size:23px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 2px 8px #152c4406}.metric{font-size:25px;font-weight:800;margin-top:8px;color:var(--navy)}.metric-label{color:var(--muted);font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:15px}.panel h3{margin:0 0 12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f5f8fb;color:#43576b;font-size:12px;text-transform:uppercase}tr:hover td{background:#fafcff}.actions{display:flex;gap:7px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.full{grid-column:1/-1}.hidden{display:none!important}.alert{padding:10px 12px;border-radius:8px;margin:10px 0;background:#fff4df;color:#795315}.error{background:#ffebeb;color:#a3272e}.successmsg{background:#e7f7ef;color:#176b48}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:300px}.pill{display:inline-block;padding:4px 8px;border-radius:30px;background:#edf2f7;font-size:12px}.pill.low{background:#ffeded;color:#a52e36}.pos{display:grid;grid-template-columns:1fr 420px;gap:15px}.productlist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-height:65vh;overflow:auto}.producttile{border:1px solid var(--line);border-radius:9px;padding:12px;background:white;text-align:left;color:var(--ink)}.producttile:hover{border-color:var(--blue)}.producttile b{display:block;margin:4px 0}.cartline{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.total{font-size:24px;font-weight:800;color:var(--navy)}.modalback{position:fixed;inset:0;background:#10223699;display:grid;place-items:center;padding:15px;z-index:5}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:13px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.toast{position:fixed;right:20px;bottom:20px;background:#1d334a;color:white;padding:12px 18px;border-radius:8px;z-index:9;box-shadow:0 5px 20px #0002}
@media(max-width:900px){.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}nav button{min-width:130px}.grid{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr}.productlist{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){main{padding:12px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.productlist{grid-template-columns:1fr 1fr}.top{padding:0 12px}.top span{font-size:12px}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="brand">AMIGO DE QUALIDADE</div>
    <div class="muted">Sistema Web com Firebase</div>
    <div id="loginmsg"></div>
    <form id="loginform">
      <label>Utilizador</label><input id="username" value="admin" required>
      <label>Senha</label><input id="password" type="password" value="Admin@123" required>
      <button type="submit">Entrar no sistema</button>
    </form>
  </div>
</div>

<div id="app">
  <header class="top"><strong id="shopTitle">AMIGO DE QUALIDADE</strong><span><span id="userLabel"></span> · <button class="secondary" id="logoutBtn">Sair</button></span></header>
  <div class="shell">
    <nav id="nav">
      <button class="active" data-page="dashboard">▦ Visão geral</button>
      <button data-page="pos">▣ Caixa / POS</button>
      <button data-page="products">▤ Produtos e grades</button>
      <button data-page="sales">▧ Vendas</button>
      <button data-page="expenses">▤ Despesas</button>
      <button data-page="suppliers">♧ Fornecedores</button>
    </nav>
    <main id="content"></main>
  </div>
</div>

<div id="modalroot"></div><div id="toastroot"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://amigo-de-qualidade-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let me = null, products = [], cart = [], currentPage = 'dashboard';
  const $ = id => document.getElementById(id);
  const money = n => (Number(n) || 0).toLocaleString('pt-MZ', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' MT';
  function toast(s) { $('toastroot').innerHTML = '<div class="toast">' + esc(s) + '</div>'; setTimeout(() => $('toastroot').innerHTML = '', 3000); }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

  $('loginform').onsubmit = async e => {
    e.preventDefault();
    if($('username').value === 'admin' && $('password').value === 'Admin@123') {
      me = { name: 'Administrador', role: 'Dono' };
      enter();
    } else {
      $('loginmsg').innerHTML = '<div class="alert error">Utilizador ou senha incorretos.</div>';
    }
  };

  async function enter() {
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    $('userLabel').textContent = me.name + ' (' + me.role + ')';
    go('dashboard');
  }

  $('logoutBtn').onclick = () => { me = null; $('app').style.display = 'none'; $('login').style.display = 'grid'; };
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.page));

  async function go(page) {
    currentPage = page;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    try {
      if(page === 'dashboard') await dashboardPage();
      else if(page === 'pos') await posPage();
      else if(page === 'products') await productsPage();
      else if(page === 'sales') await salesPage();
      else if(page === 'expenses') await expensesPage();
      else if(page === 'suppliers') await suppliersPage();
    } catch(e) { toast(e.message); }
  }

  function head(title, action='') { return '<div class="pagehead"><h1>' + title + '</h1>' + action + '</div>'; }

  async function dashboardPage() {
    $('content').innerHTML = head('Visão geral') + '<div class="grid"><div class="card"><div class="metric-label">Estado da Base de Dados</div><div class="metric" style="font-size:18px;color:var(--green)">Conectado ao Firebase</div></div></div>';
  }

  async function loadProducts() {
    const snap = await get(ref(db, 'products'));
    products = [];
    if(snap.exists()) {
      snap.forEach(childSnap => {
        let p = childSnap.val();
        p.id = childSnap.key;
        products.push(p);
      });
    }
  }

  async function productsPage() {
    await loadProducts();
    $('content').innerHTML = head('Produtos e grades', '<button onclick="productModal()">+ Novo produto</button>') +
      '<div class="panel"><div class="tablewrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Stock</th></tr></thead><tbody>' +
      products.map(p => '<tr><td><b>' + esc(p.name) + '</b></td><td>' + esc(p.category) + '</td><td>' + money(p.price) + '</td><td>' + p.stock + '</td></tr>').join('') +
      '</tbody></table></div></div>';
  }

  window.productModal = function() {
    $('modalroot').innerHTML = `<div class="modalback" onclick="if(event.target===this)$('modalroot').innerHTML=''"><div class="modal"><div class="modalhead"><h2>Cadastrar produto</h2><button class="secondary" onclick="$('modalroot').innerHTML=''">✕</button></div>
    <form id="pform" style="margin-top:15px">
      <label>Nome</label><input name="name" required>
      <label>Categoria</label><input name="category" value="Geral">
      <label>Preço (MT)</label><input name="price" type="number" value="0" required>
      <label>Stock</label><input name="stock" type="number" value="10" required>
      <button type="submit" style="margin-top:15px">Guardar</button>
    </form></div></div>`;
    
    document.getElementById('pform').onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const newProd = { name: f.get('name'), category: f.get('category'), price: Number(f.get('price')), stock: Number(f.get('stock')) };
      await push(ref(db, 'products'), newProd);
      $('modalroot').innerHTML = '';
      toast('Produto guardado no Firebase!');
      productsPage();
    };
  }

  async function posPage() {
    await loadProducts();
    $('content').innerHTML = head('Caixa / POS') + '<div class="pos"><section><div class="productlist">' +
      products.map(p => `<button class="producttile" onclick="addToCart('${p.id}')"><b>${esc(p.name)}</b><p>${money(p.price)}</p><small>Stock: ${p.stock}</small></button>`).join('') +
      '</div></section><aside class="panel"><h3>Carrinho</h3><div id="cartLines"><p class="muted">Carrinho vazio.</p></div><hr><div class="total" id="cartTotal">0,00 MT</div><button class="success" style="width:100%;margin-top:10px" onclick="checkout()">FINALIZAR VENDA</button></aside></div>';
  }

  window.addToCart = function(id) {
    let p = products.find(x => x.id === id);
    if(!p) return;
    let item = cart.find(x => x.id === id);
    if(item) item.qty++;
    else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
    renderCart();
  }

  function renderCart() {
    const root = $('cartLines');
    if(!root) return;
    root.innerHTML = cart.length ? cart.map(x => `<div class="cartline"><div><b>${esc(x.name)}</b><br>${x.qty}x ${money(x.price)}</div><div><b>${money(x.price * x.qty)}</b></div></div>`).join('') : '<p class="muted">Carrinho vazio.</p>';
    let total = cart.reduce((sum, x) => sum + (x.price * x.qty), 0);
    $('cartTotal').textContent = money(total);
  }

  window.checkout = async function() {
    if(!cart.length) return toast('Carrinho vazio.');
    let total = cart.reduce((sum, x) => sum + (x.price * x.qty), 0);
    await push(ref(db, 'sales'), { items: cart, total, date: new Date().toISOString() });
    cart = [];
    toast('Venda registada com sucesso no Firebase!');
    posPage();
  }

  async function salesPage() {
    const snap = await get(ref(db, 'sales'));
    let sales = [];
    if(snap.exists()) snap.forEach(c => sales.push({ id: c.key, ...c.val() }));
    $('content').innerHTML = head('Histórico de Vendas') + '<div class="panel"><table><tr><th>ID</th><th>Data</th><th>Total</th></tr>' +
      sales.map(s => `<tr><td>#${s.id.slice(-5)}</td><td>${new Date(s.date).toLocaleString()}</td><td><b>${money(s.total)}</b></td></tr>`).join('') +
      '</table></div>';
  }

  async function expensesPage() {
    const snap = await get(ref(db, 'expenses'));
    let expenses = [];
    if(snap.exists()) snap.forEach(c => expenses.push({ id: c.key, ...c.val() }));
    
    $('content').innerHTML = head('Despesas') + 
      '<div class="panel"><h3>Registar despesa</h3><form id="expForm" class="formgrid">' +
      '<div><label>Descrição</label><input name="desc" required></div>' +
      '<div><label>Categoria</label><input name="cat" value="Geral"></div>' +
      '<div class="full"><label>Valor (MT)</label><input name="amount" type="number" step=".01" required></div>' +
      '<button type="submit" style="margin-top:12px">Guardar despesa</button></form></div>' +
      '<div class="panel"><h3>Despesas registadas</h3><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr>' +
      expenses.map(e => `<tr><td>${new Date(e.date).toLocaleDateString()}</td><td>${esc(e.desc)}</td><td>${esc(e.cat)}</td><td><b>${money(e.amount)}</b></td></tr>`).join('') +
      '</table></div>';

    document.getElementById('expForm').onsubmit = async ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      await push(ref(db, 'expenses'), { desc: f.get('desc'), cat: f.get('cat'), amount: Number(f.get('amount')), date: new Date().toISOString() });
      toast('Despesa guardada no Firebase!');
      expensesPage();
    };
  }

  async function suppliersPage() {
    const snap = await get(ref(db, 'suppliers'));
    let suppliers = [];
    if(snap.exists()) snap.forEach(c => suppliers.push({ id: c.key, ...c.val() }));

    $('content').innerHTML = head('Fornecedores') +
      '<div class="panel"><h3>Novo fornecedor</h3><form id="supForm" class="formgrid">' +
      '<div><label>Nome</label><input name="name" required></div>' +
      '<div><label>Telefone</label><input name="phone"></div>' +
      '<div class="full"><label>Endereço / Observações</label><input name="notes"></div>' +
      '<button type="submit" style="margin-top:12px">Guardar fornecedor</button></form></div>' +
      '<div class="panel"><table><tr><th>Nome</th><th>Telefone</th><th>Observações</th></tr>' +
      suppliers.map(s => `<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.phone)}</td><td>${esc(s.notes)}</td></tr>`).join('') +
      '</table></div>';

    document.getElementById('supForm').onsubmit = async ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      await push(ref(db, 'suppliers'), { name: f.get('name'), phone: f.get('phone'), notes: f.get('notes') });
      toast('Fornecedor guardado!');
      suppliersPage();
    };
  }
</script>
</body>
</html>
