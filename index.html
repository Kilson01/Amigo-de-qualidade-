<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModaGest — Sistema de Gestão para Lojas</title>
<style>
:root{--navy:#173b63;--blue:#245b91;--bg:#f2f5f9;--ink:#1c2733;--muted:#667789;--line:#dce3eb;--green:#16865d;--red:#c33d45;--orange:#d97706}
*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:7px;padding:10px 16px;background:var(--blue);color:white;font-weight:600;transition:opacity .2s}button:hover{opacity:.9}button.secondary{background:#e7edf4;color:#24415e}button.danger{background:var(--red)}button.success{background:var(--green)}button.warning{background:var(--orange)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;background:#fff;color:#17212b}label{display:block;font-weight:600;margin:9px 0 5px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg, #173b63 0%, #245b91 100%)}.login-card{background:white;width:min(440px,100%);padding:35px;border-radius:16px;box-shadow:0 15px 50px rgba(0,0,0,.2)}.brand{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:4px;letter-spacing:.5px}.muted{color:var(--muted);font-size:13px}
#app{display:none;min-height:100vh}.top{height:65px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}.top strong{font-size:20px;letter-spacing:.5px}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 65px)}
nav{background:#fff;border-right:1px solid var(--line);padding:20px 12px}nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:#35485b;font-weight:600;padding:12px 14px;border-radius:8px}nav button.active,nav button:hover{background:#e9f1fa;color:var(--navy)}main{padding:25px;min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}.pagehead h1{font-size:22px;margin:0;color:var(--navy)}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,.02)}.panel h3{margin:0 0 15px;color:var(--navy)}table{border-collapse:collapse;width:100%}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{background:#f5f8fb;color:#43576b;font-size:12px;text-transform:uppercase}tr:hover td{background:#fafcff}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.full{grid-column:1/-1}.alert{padding:12px 14px;border-radius:8px;margin:12px 0;font-size:13px}.error{background:#ffebeb;color:#a3272e}.successmsg{background:#e7f7ef;color:#176b48}.info{background:#eef4fc;color:#1d4ed8}.toast{position:fixed;right:25px;bottom:25px;background:#173b63;color:white;padding:14px 20px;border-radius:10px;z-index:99;box-shadow:0 6px 25px rgba(0,0,0,.2);font-weight:600}
.product-img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:#f5f8fb;display:block}
.badge-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}

/* Caixa de Upload Estilo Galeria */
.upload-box{border:2px dashed #b6c6d8;border-radius:12px;padding:22px 15px;text-align:center;background:#f8fafd;cursor:pointer;transition:all .2s;margin-top:6px}
.upload-box:hover{border-color:var(--blue);background:#eef4fc}
.upload-icon{width:38px;height:38px;color:var(--blue);margin:0 auto 8px}
.upload-title{font-weight:700;font-size:15px;color:var(--navy);margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.upload-badge{display:inline-block;background:#e7f7ef;color:#16865d;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.preview-wrap{position:relative;display:inline-block;margin-top:5px}
.preview-img{max-width:100%;max-height:170px;border-radius:9px;border:1px solid var(--line);display:block;margin:0 auto}

/* Estilos do PDV / Caixa */
.pos-layout{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.pos-catalog{display:grid;grid-template-columns:repeat(auto-fill, minmax(155px, 1fr));gap:12px;max-height:70vh;overflow:auto;padding:2px}
.pos-tile{background:white;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.pos-tile:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(36,91,145,.15);transform:translateY(-2px)}
.pos-tile img{width:100%;height:110px;object-fit:cover;border-radius:6px;background:#f5f8fb;margin-bottom:8px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pay-methods{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;margin:10px 0}
.pay-btn{background:#e7edf4;color:#24415e;border:1px solid #cbd5df;padding:10px;font-size:13px;font-weight:600;border-radius:8px;text-align:center;cursor:pointer}
.pay-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
.troco-box{background:#f5f8fb;border:1px solid #dce3eb;border-radius:8px;padding:12px;margin:12px 0}

@media(max-width:960px){.pos-layout{grid-template-columns:1fr}.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav button{min-width:140px}}
@media(max-width:560px){.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ECRÃ DE LOGIN / REGISTO -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand">ModaGest</div>
    <div class="muted">Gestão Inteligente para Lojas em Moçambique</div>
    <div id="loginMsg"></div>
    <form id="loginForm" style="margin-top:20px">
      <label>E-mail ou Utilizador</label><input id="loginUser" required placeholder="Ex: admin ou seu@email.com">
      <label>Palavra-passe</label><input id="loginPass" type="password" required placeholder="••••••••">
      <button type="submit" style="width:100%;margin-top:18px">Entrar no Sistema</button>
    </form>
    <div style="text-align:center;margin-top:18px;border-top:1px solid var(--line);padding-top:15px">
      <span class="muted">Não tem conta de Caixa?</span><br>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="showRegisterModal()">Registar nova conta de Caixa</button>
    </div>
  </div>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="app">
  <header class="top">
    <strong>ModaGest — Moçambique</strong>
    <span><span id="userLabel"></span> · <button class="secondary" id="logoutBtn" style="padding:6px 12px;font-size:13px">Sair</button></span>
  </header>
  <div class="shell">
    <nav id="navMenu">
      <button class="active" data-page="dashboard">▦ Visão Geral</button>
      <button data-page="pos">▣ Caixa / PDV</button>
      <button data-page="products">▤ Produtos e Stock</button>
      <button data-page="sales" id="navSales" style="display:none">💵 Histórico e Fecho</button>
      <button data-page="users" id="navUsers" style="display:none">👥 Aprovar Caixas</button>
    </nav>
    <main id="contentArea"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://amigo-de-qualidade-default-rtdb.firebaseio.com" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const CLOUD_NAME = "t45tpzth";
  const UPLOAD_PRESET = "Amigo de qualidade";

  let currentUser = null, productsCache = [], salesCache = [], cart = [], tempImageData = '', selectedPayMethod = 'Dinheiro', currentSortOrder = 'ultimo', currentUserSort = 'pendentes', currentSalesSort = 'horario_recente';
  const $ = id => document.getElementById(id);
  const money = n => (Number(n) || 0).toLocaleString('pt-MZ', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' MT';
  function toast(msg) { $('toastRoot').innerHTML = `<div class="toast">${msg}</div>`; setTimeout(() => $('toastRoot').innerHTML = '', 3500); }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Função universal para fechar modais ao clicar no X ou cancelar
  window.fecharModal = function() {
    $('modalRoot').innerHTML = '';
  };

  async function initSystem() {
    const adminSnap = await get(ref(db, 'users/admin'));
    if(!adminSnap.exists()) {
      await set(ref(db, 'users/admin'), {
        username: 'admin',
        name: 'Dono / Administrador',
        role: 'Dono',
        email: 'admin@modagest.co.mz',
        phone: '+258 840000000',
        pass: 'Admin@123',
        status: 'ativo',
        createdAt: new Date().toISOString()
      });
    }
  }
  initSystem();

  // LOGIN
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const u = $('loginUser').value.trim();
    const p = $('loginPass').value;
    const snap = await get(ref(db, 'users'));
    if(!snap.exists()) return toast('Erro de ligação à base de dados.');

    let foundUser = null;
    snap.forEach(child => {
      let usr = child.val();
      if((usr.username === u || usr.email === u) && usr.pass === p) {
        foundUser = { id: child.key, ...usr };
      }
    });

    if(!foundUser) {
      $('loginMsg').innerHTML = '<div class="alert error">Utilizador ou palavra-passe incorretos.</div>';
      return;
    }
    if(foundUser.status === 'pendente') {
      $('loginMsg').innerHTML = '<div class="alert info">A sua conta está pendente de aprovação pelo Dono.</div>';
      return;
    }
    if(foundUser.status === 'recusado') {
      $('loginMsg').innerHTML = '<div class="alert error">O seu acesso foi recusado pelo administrador.</div>';
      return;
    }

    currentUser = foundUser;
    enterApp();
  };

  async function updatePendingBadge() {
    if(!currentUser || currentUser.role !== 'Dono') return;
    const snap = await get(ref(db, 'users'));
    let pendingCount = 0;
    if(snap.exists()) {
      snap.forEach(c => { if(c.val().status === 'pendente') pendingCount++; });
    }
    $('navUsers').innerHTML = pendingCount > 0 
      ? `👥 Aprovar Caixas <span style="background:var(--orange);color:#fff;padding:2px 7px;border-radius:12px;font-size:11px;margin-left:4px">${pendingCount}</span>` 
      : `👥 Aprovar Caixas`;
  }

  async function enterApp() {
    $('loginScreen').style.display = 'none';
    $('app').style.display = 'block';
    $('userLabel').textContent = `${currentUser.name} (${currentUser.role})`;
    
    if(currentUser.role === 'Dono') {
      $('navUsers').style.display = 'block';
      $('navSales').style.display = 'block';
      await updatePendingBadge();
      navigate('dashboard');
    } else {
      $('navUsers').style.display = 'none';
      $('navSales').style.display = 'none';
      navigate('pos');
    }
  }

  $('logoutBtn').onclick = () => {
    currentUser = null;
    $('app').style.display = 'none';
    $('loginScreen').style.display = 'grid';
    $('loginForm').reset();
    $('loginMsg').innerHTML = '';
  };

  document.querySelectorAll('#navMenu button').forEach(btn => {
    btn.onclick = () => navigate(btn.dataset.page);
  });

  async function navigate(page) {
    if(currentUser.role === 'Caixa' && page !== 'pos') {
      return toast('Acesso restrito ao PDV para operadores de caixa.');
    }
    document.querySelectorAll('#navMenu button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    try {
      if(page === 'dashboard') await renderDashboard();
      else if(page === 'pos') await renderPOS();
      else if(page === 'products') await renderProducts();
      else if(page === 'sales') await renderSalesHistory();
      else if(page === 'users') await renderUsersManagement();
    } catch(err) { toast('Erro ao carregar módulo: ' + err.message); }
  }

  function head(title, action='') { return `<div class="pagehead"><h1>${title}</h1>${action}</div>`; }

  // MODAL DE REGISTO DE CAIXA
  window.showRegisterModal = function() {
    $('modalRoot').innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:grid;place-items:center;padding:15px;z-index:99">
        <div class="panel" style="width:min(500px,100%);max-height:90vh;overflow:auto;margin:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
            <h3 style="margin:0">Registar Conta de Caixa</h3>
            <button type="button" class="secondary" style="padding:6px 12px" onclick="fecharModal()">✕</button>
          </div>
          <form id="regForm">
            <label>Nome Completo</label><input name="name" required placeholder="Ex: Maria José">
            <label>E-mail</label><input name="email" type="email" required placeholder="maria@email.com">
            <label>Contacto Telefónico</label><input name="phone" required placeholder="+258 84...">
            <label>Palavra-passe</label><input name="pass" type="password" required placeholder="Mínimo 6 caracteres">
            <button type="submit" class="success" style="width:100%;margin-top:18px">Submeter Pedido ao Dono</button>
          </form>
        </div>
      </div>`;
    $('regForm').onsubmit = async ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      await push(ref(db, 'users'), {
        username: f.get('email').split('@')[0],
        name: f.get('name').trim(),
        email: f.get('email').trim(),
        phone: f.get('phone').trim(),
        pass: f.get('pass'),
        role: 'Caixa',
        status: 'pendente',
        createdAt: new Date().toISOString()
      });
      fecharModal();
      toast('Registo efetuado! Aguarde a aprovação do Dono.');
    };
  };

  window.changeUserSort = async function(sortVal) {
    currentUserSort = sortVal;
    await renderUsersManagement();
  };

  // GESTÃO DE UTILIZADORES / CADASTROS DE CAIXA (DONO)
  async function renderUsersManagement() {
    const snap = await get(ref(db, 'users'));
    let usersList = [];
    if(snap.exists()) {
      snap.forEach(c => {
        const val = c.val();
        if(val && val.name) usersList.push({ id: c.key, ...val });
      });
    }

    const pendingCount = usersList.filter(u => u.status === 'pendente').length;
    await updatePendingBadge();

    usersList.sort((a, b) => {
      if(currentUserSort === 'pendentes') {
        const orderMap = { pendente: 1, ativo: 2, recusado: 3 };
        const diff = (orderMap[a.status] || 9) - (orderMap[b.status] || 9);
        if(diff !== 0) return diff;
        return (b.createdAt || '').localeCompare(a.createdAt || '');
      }
      if(currentUserSort === 'recentes') return (b.createdAt || '').localeCompare(a.createdAt || '');
      if(currentUserSort === 'antigos') return (a.createdAt || '').localeCompare(b.createdAt || '');
      if(currentUserSort === 'az') return (a.name || '').localeCompare(b.name || '');
      return 0;
    });

    let badgeHeader = pendingCount > 0 
      ? `<span class="badge-pill" style="background:#fff3e0;color:var(--orange);font-size:12px">${pendingCount} pendente(s) de aprovação</span>` 
      : `<span class="badge-pill" style="background:#e7f7ef;color:var(--green);font-size:12px">Todos os cadastros analisados</span>`;

    let html = head(`Cadastros e Aprovação de Caixas (${usersList.length})`, badgeHeader);

    html += `
    <div class="panel" style="padding:12px 20px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="font-weight:700;color:var(--navy)">Ordenar Lista por:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="${currentUserSort==='pendentes'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeUserSort('pendentes')">Pendentes primeiro</button>
        <button class="${currentUserSort==='recentes'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeUserSort('recentes')">Mais recentes</button>
        <button class="${currentUserSort==='antigos'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeUserSort('antigos')">Mais antigos</button>
        <button class="${currentUserSort==='az'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeUserSort('az')">Alfabeto (A - Z)</button>
      </div>
    </div>`;

    html += `<div class="panel"><div style="overflow-x:auto"><table><thead><tr><th>Nome / Utilizador</th><th>E-mail</th><th>Contacto</th><th>Data de Registo</th><th>Cargo</th><th>Estado</th><th>Ações</th></tr></thead><tbody>`;
    
    usersList.forEach(u => {
      let badgeStyle = u.status === 'ativo' 
        ? 'background:#e7f7ef;color:var(--green)' 
        : u.status === 'pendente' 
          ? 'background:#fff3e0;color:var(--orange)' 
          : 'background:#ffebeb;color:var(--red)';
      let dataReg = u.createdAt ? new Date(u.createdAt).toLocaleString('pt-MZ') : 'Conta Principal';

      html += `<tr>
        <td><b>${esc(u.name)}</b><br><small style="color:var(--muted)">User: ${esc(u.username || '-')}</small></td>
        <td>${esc(u.email)}</td>
        <td>${esc(u.phone)}</td>
        <td><small>${dataReg}</small></td>
        <td>${esc(u.role)}</td>
        <td><span class="badge-pill" style="${badgeStyle}">${esc(u.status)}</span></td>
        <td>`;

      if(u.role === 'Dono') {
        html += `<span class="muted">Administrador</span>`;
      } else if(u.status === 'pendente') {
        html += `<button class="success" style="padding:5px 10px;font-size:12px;margin-right:4px" onclick="updateUserStatus('${u.id}', 'ativo')">Aprovar</button>
                 <button class="danger" style="padding:5px 10px;font-size:12px;margin-right:4px" onclick="updateUserStatus('${u.id}', 'recusado')">Recusar</button>
                 <button class="secondary" style="padding:5px 9px;font-size:12px" onclick="deleteUser('${u.id}')">Excluir</button>`;
      } else if(u.status === 'ativo') {
        html += `<button class="warning" style="padding:5px 10px;font-size:12px;margin-right:4px" onclick="updateUserStatus('${u.id}', 'pendente')">Suspender</button>
                 <button class="danger" style="padding:5px 9px;font-size:12px" onclick="deleteUser('${u.id}')">Excluir</button>`;
      } else {
        html += `<button class="success" style="padding:5px 10px;font-size:12px;margin-right:4px" onclick="updateUserStatus('${u.id}', 'ativo')">Reativar</button>
                 <button class="danger" style="padding:5px 9px;font-size:12px" onclick="deleteUser('${u.id}')">Excluir</button>`;
      }
      html += `</td></tr>`;
    });

    html += `</tbody></table></div></div>`;
    $('contentArea').innerHTML = html;
  }

  window.updateUserStatus = async function(id, newStatus) {
    await update(ref(db, `users/${id}`), { status: newStatus });
    toast(`Estado atualizado para: ${newStatus}`);
    await renderUsersManagement();
  };

  window.deleteUser = async function(id) {
    if(confirm('Tem certeza que deseja remover permanentemente este cadastro?')) {
      await remove(ref(db, `users/${id}`));
      toast('Cadastro removido.');
      await renderUsersManagement();
    }
  };

  // CARREGAR PRODUTOS COM ORDENAÇÃO
  async function loadProducts() {
    const snap = await get(ref(db, 'products'));
    let rawList = [];
    if(snap.exists()) {
      snap.forEach(c => {
        const val = c.val();
        if(val && val.name) rawList.push({ id: c.key, ...val });
      });
    }
    productsCache = [...rawList].sort((a, b) => {
      if(currentSortOrder === 'az') return a.name.localeCompare(b.name);
      if(currentSortOrder === 'primeiro') return (a.createdAt || '').localeCompare(b.createdAt || '');
      if(currentSortOrder === 'ultimo') return (b.createdAt || '').localeCompare(a.createdAt || '');
      if(currentSortOrder === 'mais_stock') return Number(b.stock) - Number(a.stock);
      if(currentSortOrder === 'menos_stock') return Number(a.stock) - Number(b.stock);
      return 0;
    });
  }

  window.changeSortOrder = async function(orderVal) {
    currentSortOrder = orderVal;
    await renderProducts();
  };

  // PRODUTOS E STOCK
  async function renderProducts() {
    await loadProducts();
    let actionBtn = currentUser.role === 'Dono' ? `<button onclick="openProductModal()">+ Novo Produto</button>` : '';
    
    let html = head(`Produtos e Stock (${productsCache.length} artigos)`, actionBtn);
    html += `
    <div class="panel" style="padding:12px 20px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="font-weight:700;color:var(--navy)">Ordenar Lista por:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="${currentSortOrder==='ultimo'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSortOrder('ultimo')">Último produto</button>
        <button class="${currentSortOrder==='primeiro'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSortOrder('primeiro')">Primeiro produto</button>
        <button class="${currentSortOrder==='az'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSortOrder('az')">Alfabeto (A - Z)</button>
        <button class="${currentSortOrder==='mais_stock'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSortOrder('mais_stock')">Mais stock</button>
        <button class="${currentSortOrder==='menos_stock'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSortOrder('menos_stock')">Menos stock</button>
      </div>
    </div>`;

    html += `<div class="panel"><div style="overflow-x:auto"><table><thead><tr><th>Foto</th><th>Nome do Produto</th><th>Categoria</th><th>Tamanho / Cor</th><th>Custo</th><th>Preço Venda</th><th>Stock</th><th>Ações Rápidas</th></tr></thead><tbody>`;
    
    if(productsCache.length === 0) {
      html += `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:30px">Nenhum produto registado ainda.</td></tr>`;
    } else {
      productsCache.forEach(p => {

  window.handleImageSelect = async function(input) {
    const file = input.files[0];
    if(!file) return;
    const box = $('uploadBoxContent');
    if(box) box.innerHTML = `<div style="padding:15px;color:var(--navy);font-weight:600">A enviar foto para a nuvem (Cloudinary)...</div>`;

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    try {
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
      const data = await response.json();
      if(data.secure_url) {
        tempImageData = data.secure_url;
        updateUploadBoxUI();
        toast('Fotografia enviada com sucesso!');
      } else { throw new Error('Falha no upload.'); }
    } catch(err) {
      toast('Erro ao enviar imagem.');
      updateUploadBoxUI();
    }
  };

  window.clearSelectedImage = function(ev) {
    if(ev) ev.stopPropagation();
    tempImageData = '';
    const fileInput = $('prodImgInput');
    if(fileInput) fileInput.value = '';
    updateUploadBoxUI();
  };

  function renderPOSGrid(list) {
    if(list.length === 0) return `<div class="muted" style="grid-column:1/-1;text-align:center;padding:30px">Nenhum produto encontrado.</div>`;
    return list.map(p => {
      let img = p.image ? `<img src="${esc(p.image)}">` : `<div style="width:100%;height:110px;background:#eef4fc;display:grid;place-items:center;border-radius:6px;margin-bottom:8px;color:var(--muted);font-size:11px">Sem foto</div>`;
      return `
        <div class="pos-tile" onclick="addToCart('${p.id}')">
          <div>
            ${img}
            <div style="font-weight:700;font-size:13px;margin-bottom:2px">${esc(p.name)}</div>
            <div style="font-size:11px;color:var(--muted)">Tam: ${esc(p.size)} | Cor: ${esc(p.color)}</div>
          </div>
          <div style="margin-top:8px">
            <div style="font-weight:800;color:var(--blue);font-size:14px">${money(p.price)}</div>
            <div style="font-size:10px;color:${p.stock<=3?'var(--red)':'var(--muted)'}">Stock: ${p.stock} un.</div>
          </div>
        </div>`;
    }).join('');
  }

  window.filterPOSProducts = function(query) {
    const q = query.toLowerCase();
    const filtered = productsCache.filter(p => 
      p.name.toLowerCase().includes(q) || 
      (p.sku && p.sku.toLowerCase().includes(q)) || 
      (p.size && p.size.toLowerCase().includes(q)) ||
      (p.color && p.color.toLowerCase().includes(q))
    );
    $('posCatalogGrid').innerHTML = renderPOSGrid(filtered);
  };

  window.addToCart = function(productId) {
    const prod = productsCache.find(x => x.id === productId);
    if(!prod) return;
    if(prod.stock <= 0) return toast('Artigo esgotado!');

    const existing = cart.find(x => x.id === productId);
    if(existing) {
      if(existing.qty >= prod.stock) return toast('Quantidade máxima em stock atingida!');
      existing.qty++;
    } else {
      cart.push({ id: prod.id, name: prod.name, price: prod.price, size: prod.size, color: prod.color, qty: 1, maxStock: prod.stock });
    }
    renderCartUI();
  };

  window.updateCartQty = function(productId, delta) {
    const item = cart.find(x => x.id === productId);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0) {
      cart = cart.filter(x => x.id !== productId);
    } else if(item.qty > item.maxStock) {
      item.qty = item.maxStock;
      toast('Limite de stock atingido.');
    }
    renderCartUI();
  };

  window.setPayMethod = function(method) {
    selectedPayMethod = method;
    document.querySelectorAll('.pay-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === method));
    const trocoBox = $('trocoSection');
    if(trocoBox) {
      trocoBox.style.display = method === 'Dinheiro' ? 'block' : 'none';
      if(method === 'Dinheiro') calcularTroco();
    }
  };

  window.calcularTroco = function() {
    const total = cart.reduce((acc, x) => acc + (x.price * x.qty), 0);
    const inputEl = $('cashReceived');
    const displayEl = $('trocoDisplay');
    if(!inputEl || !displayEl) return;

    const recebido = Number(inputEl.value) || 0;
    if(recebido === 0) {
      displayEl.textContent = money(0);
      displayEl.style.color = 'var(--muted)';
      return;
    }

    const diff = recebido - total;
    if(diff < 0) {
      displayEl.textContent = `Falta ${money(Math.abs(diff))}`;
      displayEl.style.color = 'var(--red)';
    } else {
      displayEl.textContent = money(diff);
      displayEl.style.color = 'var(--green)';
    }
  };

  function renderCartUI() {
    const listEl = $('cartItemsList');
    const totalEl = $('cartGrandTotal');
    if(!listEl) return;

    if(cart.length === 0) {
      listEl.innerHTML = `<p class="muted" style="text-align:center;padding:20px">Nenhum item adicionado.</p>`;
      totalEl.textContent = money(0);
      calcularTroco();
      return;
    }

    let total = 0;
    listEl.innerHTML = cart.map(item => {
      let sub = item.price * item.qty;
      total += sub;
      return `
        <div class="cart-item">
          <div>
            <b>${esc(item.name)}</b><br>
            <small style="color:var(--muted)">Tam: ${esc(item.size)} | Cor: ${esc(item.color)}</small><br>
            <span style="font-weight:700;color:var(--blue)">${money(item.price)}</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <button class="secondary" style="padding:2px 8px" onclick="updateCartQty('${item.id}', -1)">-</button>
            <span style="font-weight:700;width:20px;text-align:center">${item.qty}</span>
            <button class="secondary" style="padding:2px 8px" onclick="updateCartQty('${item.id}', 1)">+</button>
          </div>
        </div>`;
    }).join('');

    totalEl.textContent = money(total);
    calcularTroco();
  }

  window.checkoutSale = async function() {
    if(cart.length === 0) return toast('O carrinho está vazio.');
    let total = cart.reduce((acc, x) => acc + (x.price * x.qty), 0);
    let recebido = 0, troco = 0;

    if(selectedPayMethod === 'Dinheiro') {
      recebido = Number($('cashReceived')?.value) || 0;
      if(recebido > 0 && recebido < total) {
        return toast('O valor recebido é inferior ao total da venda!');
      }
      troco = recebido >= total ? recebido - total : 0;
    }

    const saleData = {
      items: cart,
      total: total,
      paymentMethod: selectedPayMethod,
      cashReceived: recebido,
      changeGiven: troco,
      cashier: currentUser.name,
      date: new Date().toISOString()
    };

    await push(ref(db, 'sales'), saleData);

    for(let item of cart) {
      let prod = productsCache.find(x => x.id === item.id);
      if(prod) {
        let newStock = prod.stock - item.qty;
        await update(ref(db, `products/${item.id}`), { stock: newStock });
      }
    }

    toast(troco > 0 ? `Venda concluída! Troco: ${money(troco)}` : 'Venda efetuada com sucesso!');
    cart = [];
    await renderPOS();
  };

  // ==========================================
  // HISTÓRICO DE VENDAS E FECHO DE CAIXA
  // ==========================================
  async function loadSales() {
    const snap = await get(ref(db, 'sales'));
    salesCache = [];
    if(snap.exists()) {
      snap.forEach(c => salesCache.push({ id: c.key, ...c.val() }));
    }
  }

  window.changeSalesSort = async function(sortVal) {
    currentSalesSort = sortVal;
    await renderSalesHistory();
  };

  async function renderSalesHistory() {
    await loadSales();

    salesCache.sort((a, b) => {
      if(currentSalesSort === 'horario_recente') {
        return (b.date || '').localeCompare(a.date || '');
      } else if(currentSalesSort === 'horario_antigo') {
        return (a.date || '').localeCompare(b.date || '');
      } else if(currentSalesSort === 'az') {
        let nameA = (a.items && a.items[0] && a.items[0].name) || '';
        let nameB = (b.items && b.items[0] && b.items[0].name) || '';
        return nameA.localeCompare(nameB);
      } else if(currentSalesSort === 'mais_vendido') {
        let qtyA = (a.items || []).reduce((sum, i) => sum + i.qty, 0);
        let qtyB = (b.items || []).reduce((sum, i) => sum + i.qty, 0);
        return qtyB - qtyA;
      } else if(currentSalesSort === 'menos_vendido') {
        let qtyA = (a.items || []).reduce((sum, i) => sum + i.qty, 0);
        let qtyB = (b.items || []).reduce((sum, i) => sum + i.qty, 0);
        return qtyA - qtyB;
      }
      return 0;
    });

    let totalFaturado = salesCache.reduce((acc, s) => acc + (s.total || 0), 0);
    let totalDinheiro = salesCache.filter(s => s.paymentMethod === 'Dinheiro').reduce((acc, s) => acc + (s.total || 0), 0);
    let totalMpesa = salesCache.filter(s => s.paymentMethod === 'M-Pesa').reduce((acc, s) => acc + (s.total || 0), 0);
    let totalEletronico = salesCache.filter(s => s.paymentMethod !== 'Dinheiro').reduce((acc, s) => acc + (s.total || 0), 0);

    let html = head('Histórico de Vendas e Fecho de Caixa');

    html += `
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:15px;margin-bottom:20px">
      <div class="panel" style="margin:0"><div class="muted">Total Faturado Geral</div><div style="font-size:22px;font-weight:800;color:var(--navy);margin-top:5px">${money(totalFaturado)}</div></div>
      <div class="panel" style="margin:0"><div class="muted">Entradas em Dinheiro</div><div style="font-size:20px;font-weight:800;color:var(--green);margin-top:5px">${money(totalDinheiro)}</div></div>
      <div class="panel" style="margin:0"><div class="muted">M-Pesa</div><div style="font-size:20px;font-weight:800;color:var(--blue);margin-top:5px">${money(totalMpesa)}</div></div>
      <div class="panel" style="margin:0"><div class="muted">Outros (e-Mola / mKesh)</div><div style="font-size:20px;font-weight:800;color:var(--orange);margin-top:5px">${money(totalEletronico - totalMpesa)}</div></div>
    </div>`;

    html += `
    <div class="panel" style="padding:12px 20px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="font-weight:700;color:var(--navy)">Ordenar Histórico por:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="${currentSalesSort==='horario_recente'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSalesSort('horario_recente')">Horário (Mais recente)</button>
        <button class="${currentSalesSort==='horario_antigo'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSalesSort('horario_antigo')">Horário (Mais antigo)</button>
        <button class="${currentSalesSort==='az'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSalesSort('az')">Alfabeto (A - Z)</button>
        <button class="${currentSalesSort==='mais_vendido'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSalesSort('mais_vendido')">Mais vendido</button>
        <button class="${currentSalesSort==='menos_vendido'?'':'secondary'}" style="padding:6px 12px;font-size:12px" onclick="changeSalesSort('menos_vendido')">Menos vendido</button>
      </div>
    </div>`;

    html += `
    <div class="panel">
      <h3>Registo de Vendas Efetuadas (${salesCache.length})</h3>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Data / Hora</th>
              <th>Operador (Caixa)</th>
              <th>Itens Vendidos</th>
              <th>Método</th>
              <th>Total</th>
              <th>Detalhes / Troco</th>
            </tr>
          </thead>
          <tbody>`;

    if(salesCache.length === 0) {
      html += `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">Nenhuma venda registada ainda.</td></tr>`;
    } else {
      salesCache.forEach(s => {
        let dataFmd = new Date(s.date).toLocaleString('pt-MZ');
        let itensStr = (s.items || []).map(i => `${i.qty}x ${i.name} (${i.size}, ${i.color})`).join('<br>');
        let detalhes = s.paymentMethod === 'Dinheiro' ? `Recebido: ${money(s.cashReceived)}<br>Troco: ${money(s.changeGiven)}` : `Transação eletrónica`;

        html += `
          <tr>
            <td><small>${dataFmd}</small></td>
            <td><b>${esc(s.cashier)}</b></td>
            <td><div style="font-size:13px">${itensStr}</div></td>
            <td><span style="background:#eef4fc;padding:4px 8px;border-radius:4px;font-weight:600">${esc(s.paymentMethod)}</span></td>
            <td><b style="color:var(--green)">${money(s.total)}</b></td>
            <td><small style="color:var(--muted)">${detalhes}</small></td>
          </tr>`;
      });
    }

    html += `</tbody></table></div></div>`;
    $('contentArea').innerHTML = html;
  }

  async function renderDashboard() {
    await loadProducts();
    await loadSales();
    await updatePendingBadge();
    let lowStockCount = productsCache.filter(p => p.stock <= 3).length;
    let totalVendasHoje = salesCache.reduce((acc, s) => acc + (s.total || 0), 0);

    $('contentArea').innerHTML = head('Visão Geral') + `
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:15px;margin-bottom:20px">
        <div class="panel" style="margin:0"><div class="muted">Total de Artigos Cadastrados</div><div style="font-size:24px;font-weight:800;color:var(--navy);margin-top:5px">${productsCache.length}</div></div>
        <div class="panel" style="margin:0"><div class="muted">Faturamento Total Registado</div><div style="font-size:22px;font-weight:800;color:var(--green);margin-top:5px">${money(totalVendasHoje)}</div></div>
        <div class="panel" style="margin:0"><div class="muted">Alertas de Stock Baixo</div><div style="font-size:22px;font-weight:800;color:${lowStockCount > 0 ? 'var(--red)' : 'var(--green)'};margin-top:5px">${lowStockCount} artigos</div></div>
      </div>
      <div class="panel"><h3>Bem-vindo ao ModaGest</h3><p class="muted">O sistema está completo e operacional. Use o menu lateral para navegar entre o Caixa, Stock, Histórico de Vendas e Aprovação de Caixas.</p></div>`;
  }
</script>
</body>
</html>
