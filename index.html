<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">ModaGest — Sistema de Gestão para Lojas</title>
<style>
:root{
  --navy:#173b63;
  --blue:#245b91;
  --bg:#f2f5f9;
  --ink:#1c2733;
  --muted:#667789;
  --line:#dce3eb;
  --green:#16865d;
  --red:#c33d45;
  --orange:#d97706;
  --panel-bg:#ffffff;
  --th-bg:#f5f8fb;
  --th-ink:#43576b;
  --tr-hover:#fafcff;
}
*{box-sizing:border-box}
body{margin:0;font:14px "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 16px;background:var(--blue);color:white;font-weight:600;transition:opacity .2s}
button:hover{opacity:.9}
button.secondary{background:#e7edf4;color:#24415e}
button.danger{background:var(--red)}
button.success{background:var(--green)}
button.warning{background:var(--orange)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;background:#fff;color:var(--ink)}
input[type="checkbox"]{width:auto}
input[type="color"]{padding:2px;height:40px;cursor:pointer}
label{display:block;font-weight:600;margin:9px 0 5px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%)}
.login-card{background:var(--panel-bg);width:min(440px,100%);padding:35px;border-radius:16px;box-shadow:0 15px 50px rgba(0,0,0,.2)}
.brand{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:4px;letter-spacing:.5px}
.muted{color:var(--muted);font-size:13px}
#app{display:none;min-height:100vh}
.top{height:65px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.top strong{font-size:20px;letter-spacing:.5px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 65px)}
nav{background:var(--panel-bg);border-right:1px solid var(--line);padding:20px 12px}
nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:var(--ink);font-weight:600;padding:12px 14px;border-radius:8px}
nav button.active,nav button:hover{background:#e9f1fa;color:var(--navy)}
main{padding:25px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.pagehead h1{font-size:22px;margin:0;color:var(--navy)}
.panel{background:var(--panel-bg);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.panel h3{margin:0 0 15px;color:var(--navy)}
table{border-collapse:collapse;width:100%}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--th-bg);color:var(--th-ink);font-size:12px;text-transform:uppercase}
tr:hover td{background:var(--tr-hover)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}
.full{grid-column:1/-1}
.alert{padding:12px 14px;border-radius:8px;margin:12px 0;font-size:13px}
.error{background:#ffebeb;color:#a3272e}
.successmsg{background:#e7f7ef;color:#176b48}
.info{background:#eef4fc;color:#1d4ed8}
.toast{position:fixed;right:25px;bottom:25px;background:var(--navy);color:white;padding:14px 20px;border-radius:10px;z-index:99;box-shadow:0 6px 25px rgba(0,0,0,.2);font-weight:600;max-width:90vw}
.product-img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:#f5f8fb;display:block}
.badge-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;text-transform:uppercase}

/* Caixa de Upload Estilo Galeria */
.upload-box{border:2px dashed #b6c6d8;border-radius:12px;padding:22px 15px;text-align:center;background:#f8fafd;cursor:pointer;transition:all .2s;margin-top:6px}
.upload-box:hover{border-color:var(--blue);background:#eef4fc}
.upload-title{font-weight:700;font-size:15px;color:var(--navy);margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.upload-badge{display:inline-block;background:#e7f7ef;color:#16865d;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.preview-wrap{position:relative;display:inline-block;margin-top:5px}
.preview-img{max-width:100%;max-height:170px;border-radius:9px;border:1px solid var(--line);display:block;margin:0 auto}
.noimg-box{display:grid;place-items:center;font-size:10px;color:#888;background:#eef4fc;border-radius:6px}

/* Visão Geral */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;margin-bottom:20px}
.dash-card{background:var(--panel-bg);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.dash-card h3{margin:0;font-size:15px;color:var(--navy)}
.dash-big{font-size:22px;font-weight:800;color:var(--navy);margin:8px 0 4px}
.dash-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.dash-legend{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.45}

/* Estilos do PDV / Caixa */
.pos-layout{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.pos-catalog{display:grid;grid-template-columns:repeat(auto-fill, minmax(155px, 1fr));gap:12px;max-height:70vh;overflow:auto;padding:2px}
.pos-tile{background:var(--panel-bg);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.pos-tile:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(36,91,145,.15);transform:translateY(-2px)}
.pos-tile img{width:100%;height:110px;object-fit:cover;border-radius:6px;background:#f5f8fb;margin-bottom:8px}
.pos-tile .noimg-box{width:100%;height:110px;margin-bottom:8px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pay-methods{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;margin:10px 0}
.pay-btn{background:#e7edf4;color:#24415e;border:1px solid #cbd5df;padding:10px;font-size:13px;font-weight:600;border-radius:8px;text-align:center;cursor:pointer}
.pay-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
.troco-box{background:#f5f8fb;border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}

/* ESTILO EXCLUSIVO PARA IMPRESSÃO DE TALÃO E RELATÓRIOS */
@media print {
  body * { visibility: hidden; }
  #printReceiptModal, #printReceiptModal * { visibility: visible; }
  #printReceiptModal { position: absolute; inset: 0; background: #fff !important; padding: 0 !important; margin: 0 !important; width: 100% !important; box-shadow: none !important; border: none !important; }
  .no-print { display: none !important; }

  /* Relatórios (Via 1 e Via 2, cada uma em folhas A4) */
  body.printing-report #app, body.printing-report #loginScreen, body.printing-report #toastRoot { display: none !important; }
  body.printing-report #printReportModal, body.printing-report #printReportModal * { visibility: visible; }
  body.printing-report .print-overlay { position: static !important; background: none !important; padding: 0 !important; overflow: visible !important; }
  body.printing-report .print-overlay > div { max-width: none !important; width: 100% !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; }
  .rep-table thead { display: table-header-group; }
  .rep-table tr { page-break-inside: avoid; }
  .html2pdf__page-break { page-break-after: always; break-after: page; }
  @page { size: A4; margin: 12mm; }
}
.html2pdf__page-break{height:0;page-break-after:always;break-after:page}
.rep-table{border-collapse:collapse;width:100%}
.rep-table th,.rep-table td{border:1px solid #cbd5df;padding:5px 7px;text-align:left;vertical-align:top;font-size:12px}
.rep-table th{background:#f5f8fb;font-size:11px;text-transform:uppercase}

@media(max-width:960px){.pos-layout{grid-template-columns:1fr}.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav button{min-width:140px}}
@media(max-width:560px){.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ECRÃ DE LOGIN / REGISTO -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand" id="loginBrandName">ModaGest</div>
    <div class="muted" id="loginBrandSubtitle">Gestão Inteligente para Lojas em Moçambique</div>
    <div id="loginMsg"></div>
    <form id="loginForm" style="margin-top:20px">
      <label>E-mail ou Utilizador</label><input id="loginUser" required placeholder="Ex: admin ou seu@email.com">
      <label>Palavra-passe</label><input id="loginPass" type="password" required placeholder="••••••••">
      <button type="submit" style="width:100%;margin-top:18px">Entrar no Sistema</button>
    </form>
    <div style="text-align:center;margin-top:18px;border-top:1px solid var(--line);padding-top:15px">
      <span class="muted">Não tem conta de Caixa?</span><br>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="showRegisterModal()">Registar nova conta de Caixa</button>
    </div>
  </div>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="app">
  <header class="top">
    <strong id="topBrandHeader">ModaGest — Moçambique</strong>
    <span style="display:flex;align-items:center;gap:8px">
      <span id="userLabel"></span>
      <button class="secondary" onclick="atualizarDadosSistema()" style="padding:6px 12px;font-size:13px" title="Atualizar dados sem sair">🔄 Atualizar</button>
      <button class="secondary" id="logoutBtn" style="padding:6px 12px;font-size:13px">Sair</button>
    </span>
  </header>
  <div class="shell">
    <nav id="navMenu">
      <button class="active" data-page="dashboard">▦ Visão Geral</button>
      <button data-page="pos">▣ Caixa / PDV</button>
      <button data-page="products">▤ Produtos e Stock</button>
      <button data-page="expenses" id="navExpenses" style="display:none">🧾 Despesas</button>
      <button data-page="sales" id="navSales" style="display:none">💵 Histórico e Fecho</button>
      <button data-page="users" id="navUsers" style="display:none">👥 Aprovar Caixas</button>
      <button data-page="settings" id="navSettings" style="display:none">⚙️ Definições</button>
    </nav>
    <main id="contentArea"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://amigo-de-qualidade-default-rtdb.firebaseio.com" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const CLOUD_NAME = "t45tpzth";
  const UPLOAD_PRESET = "Amigo de qualidade";

  // ---------- Constantes de negócio ----------
  const DEFAULT_PRODUCT_CATEGORIES = ['Capulanas','Painéis solares','Produtos de vestuário','Produtos alimentares','Materiais de limpeza','Máquinas de costura','Equipamentos elétricos','Ferramentas','Outros produtos diversos'];
  const DEFAULT_EXPENSE_CATEGORIES = ['Transporte','Energia','Combustível','Água','Internet','Comunicação','Salários','Aluguer da loja','Manutenção de equipamentos','Alimentação em serviço','Impostos e taxas','Material de escritório','Outras despesas'];
  const UNIT_TYPES = ['un.','pacote','fardo','caixa','saco','litro','kg','metro','plástico','lote'];
  const EXPENSE_TYPES = { operacional: 'Operacional', aquisicao: 'Aquisição (não contabilizada)', outra: 'Outra despesa' };
  const STOCK_BAIXO = 3;        // stock igual ou abaixo deste valor = baixo
  const REPOSICAO_IDEAL = 10;   // stock de referência para cálculo da reposição
  const PERIOD_LABELS = { diario: '📅 Hoje', semanal: '📊 Semana', mensal: '📈 Mês', anual: '🗓️ Ano', tudo: '♾️ Tudo' };
  const REPORT_TITLES = {
    diario: 'Relatório Diário (Hoje)',
    semanal: 'Relatório Semanal (Esta Semana)',
    mensal: 'Relatório Mensal (Este Mês)',
    anual: 'Relatório Anual (Este Ano)',
    tudo: 'Relatório Geral (Todas as Vendas)'
  };
  const REPORT_FILE = { diario: 'Diario', semanal: 'Semanal', mensal: 'Mensal', anual: 'Anual', tudo: 'Geral' };

  const DEFAULT_SETTINGS = {
    companyName: "ModaGest",
    companySubtitle: "Gestão Inteligente para Lojas em Moçambique",
    topHeaderSuffix: "Moçambique",
    navyColor: "#173b63",
    blueColor: "#245b91",
    bgColor: "#f2f5f9",
    inkColor: "#1c2733",
    panelBgColor: "#ffffff",
    thBgColor: "#f5f8fb",
    thInkColor: "#43576b",
    lineColor: "#dce3eb"
  };

  // ---------- Estado ----------
  let appSettings = { ...DEFAULT_SETTINGS };
  let isUploadingImage = false, isUploadingExpense = false, isSaving = false;
  let currentUser = null, tempImageData = '', expPhoto = '';
  let productsCache = [], salesCache = [], purchasesCache = [], expensesCache = [];
  let productCategories = [], expenseCategories = [];
  let cart = [], selectedPayMethod = 'Dinheiro';
  let currentReportFilter = 'diario', currentPage = 'dashboard';
  let dashPeriod = 'mensal';
  let expPeriod = 'mensal', expCat = '', expSearch = '';
  let historyTab = 'vendas', historySearch = '', showArchived = false;

  // ---------- Utilidades ----------
  const $ = id => document.getElementById(id);
  const num = v => Number(v) || 0;
  const r2 = v => Math.round(num(v) * 100) / 100;
  const r4 = v => Math.round(num(v) * 10000) / 10000;
  const sumBy = (arr, fn) => arr.reduce((a, x) => a + (Number(fn(x)) || 0), 0);
  const money = n => (Number(n) || 0).toLocaleString('pt-MZ', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' MT';
  const pct = n => (Number(n) || 0).toLocaleString('pt-MZ', {minimumFractionDigits:1, maximumFractionDigits:1}) + ' %';
  const isDono = () => !!currentUser && currentUser.role === 'Dono';
  // Custo unitário atual do produto (compatível com registos antigos que só têm "cost")
  const unitCostOf = p => num(p.costUnit ?? p.cost);
  const isActiveSale = s => !s.estornada && !s.archived;
  const saleCost = s => sumBy(s.items || [], i => num(i.qty) * num(i.unitCost));
  const hasCost = s => (s.items || []).every(i => i.unitCost !== undefined && i.unitCost !== null);

  // ---------- Palavras-passe (PBKDF2-SHA256 com sal) ----------
  const newSalt = () => Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2,'0')).join('');
  async function hashPass(pass, salt) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' }, key, 256);
    return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  async function setPassword(obj, pass) {
    obj.salt = newSalt();
    obj.passHash = await hashPass(pass, obj.salt);
    delete obj.pass;
    return obj;
  }
  // Contas antigas com palavra-passe em texto simples continuam a entrar (e são convertidas no login)
  async function checkPassword(user, pass) {
    if(user.passHash && user.salt) return (await hashPass(pass, user.salt)) === user.passHash;
    return user.pass !== undefined && user.pass !== null && user.pass === pass;
  }
  const sessionOf = u => ({ id: u.id, name: u.name, role: u.role, username: u.username, email: u.email, status: u.status });

  function toast(msg) { $('toastRoot').innerHTML = `<div class="toast">${msg}</div>`; setTimeout(() => $('toastRoot').innerHTML = '', 3500); }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function overlay(inner) { return `<div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:grid;place-items:center;padding:15px;z-index:99">${inner}</div>`; }

  // Confirmação com palavra-passe do Dono (para ações sensíveis)
  async function confirmDono(msg) {
    if(!confirm(msg)) return false;
    const p = prompt('Confirme com a palavra-passe do Dono:');
    if(p === null) return false;
    const snap = await get(ref(db, `users/${currentUser.id}`));
    if(!(await checkPassword(snap.val() || {}, p))) { toast('Palavra-passe incorreta. Ação cancelada.'); return false; }
    return true;
  }

  // ---------- Períodos ----------
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  function periodRange(type) {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const sod = new Date(y, m, now.getDate());
    if(type === 'diario') return [sod, addDays(sod, 1)];
    if(type === 'semanal') { const ws = addDays(sod, -((sod.getDay() + 6) % 7)); return [ws, addDays(ws, 7)]; }
    if(type === 'mensal') return [new Date(y, m, 1), new Date(y, m + 1, 1)];
    if(type === 'anual') return [new Date(y, 0, 1), new Date(y + 1, 0, 1)];
    return null; // tudo
  }
  function inPeriod(iso, type) {
    if(!iso) return false;
    const d = new Date(iso);
    if(isNaN(d)) return false;
    const r = periodRange(type);
    return !r || (d >= r[0] && d < r[1]);
  }
  function periodLabel(type) {
    const fmt = d => d.toLocaleDateString('pt-MZ');
    const now = new Date();
    if(type === 'diario') return fmt(now);
    if(type === 'semanal') { const [a, b] = periodRange('semanal'); return `${fmt(a)} a ${fmt(addDays(b, -1))}`; }
    if(type === 'mensal') return now.toLocaleDateString('pt-MZ', { month: 'long', year: 'numeric' });
    if(type === 'anual') return String(now.getFullYear());
    return 'Desde o início';
  }
  function periodButtons(current, fn) {
    return Object.entries(PERIOD_LABELS).map(([t, l]) =>
      `<button class="${t === current ? '' : 'secondary'}" style="padding:7px 14px;font-size:13px" onclick="${fn}('${t}')">${l}</button>`).join('');
  }

  // Vendas do período. Por defeito exclui estornadas e arquivadas (não contam nos totais).
  function filterSalesByPeriod(list, type, opts = {}) {
    return list.filter(s => {
      if(!s.date || !inPeriod(s.date, type)) return false;
      if(s.estornada && !opts.includeVoided) return false;
      if(s.archived && !opts.includeArchived) return false;
      return true;
    }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }

  // Resumo financeiro de um conjunto de vendas ativas
  function summarizeSales(list) {
    const active = list.filter(isActiveSale);
    const fat = sumBy(active, s => s.total);
    const cmv = sumBy(active, saleCost);
    const lucro = fat - cmv;
    const byMethod = ['Dinheiro','M-Pesa','e-Mola','mKesh'].map(m => {
      const arr = active.filter(s => s.paymentMethod === m);
      return { m, n: arr.length, t: sumBy(arr, s => s.total) };
    });
    const byCategory = {};
    active.forEach(s => (s.items || []).forEach(i => {
      const c = i.category || 'Sem categoria';
      byCategory[c] = (byCategory[c] || 0) + num(i.qty) * num(i.price);
    }));
    return {
      n: active.length, fat, cmv, lucro,
      margem: fat > 0 ? lucro / fat * 100 : 0,
      semCusto: active.filter(s => !hasCost(s)).length,
      byMethod,
      byCategory: Object.entries(byCategory).sort((a, b) => b[1] - a[1])
    };
  }

  // ---------- Carregamento de dados ----------
  async function loadList(path) {
    const snap = await get(ref(db, path));
    const out = [];
    if(snap.exists()) snap.forEach(c => { out.push({ id: c.key, ...c.val() }); });
    return out;
  }
  async function loadProducts() {
    productsCache = (await loadList('products')).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  }
  async function loadSales() { salesCache = await loadList('sales'); }
  async function loadPurchases() {
    purchasesCache = (await loadList('purchases')).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }
  async function loadExpenses() {
    expensesCache = (await loadList('expenses')).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }
  // Cria as categorias padrão apenas quando o nó ainda não existe
  async function ensureCategories(path, defaults) {
    const snap = await get(ref(db, path));
    if(!snap.exists()) { for(const n of defaults) await push(ref(db, path), { name: n, default: true }); }
  }
  async function loadCategories() {
    await ensureCategories('categories', DEFAULT_PRODUCT_CATEGORIES);
    await ensureCategories('expenseCategories', DEFAULT_EXPENSE_CATEGORIES);
    productCategories = (await loadList('categories')).sort((a, b) => a.name.localeCompare(b.name, 'pt'));
    expenseCategories = (await loadList('expenseCategories')).sort((a, b) => a.name.localeCompare(b.name, 'pt'));
  }

  // ---------- Definições ----------
  window.fecharModal = function() {
    document.body.classList.remove('printing-report');
    $('modalRoot').innerHTML = '';
  };

  window.atualizarDadosSistema = async function() {
    toast('A sincronizar dados...');
    await loadSettings();
    await navigate(currentPage);
    toast('Sistema atualizado!');
  };

  function applySettingsToUI(cfg) {
    appSettings = { ...DEFAULT_SETTINGS, ...cfg };
    const r = document.documentElement.style;
    r.setProperty('--navy', appSettings.navyColor);
    r.setProperty('--blue', appSettings.blueColor);
    r.setProperty('--bg', appSettings.bgColor);
    r.setProperty('--ink', appSettings.inkColor);
    r.setProperty('--panel-bg', appSettings.panelBgColor);
    r.setProperty('--th-bg', appSettings.thBgColor);
    r.setProperty('--th-ink', appSettings.thInkColor);
    r.setProperty('--line', appSettings.lineColor);

    $('pageTitle').textContent = `${appSettings.companyName} — Sistema de Gestão`;
    $('loginBrandName').textContent = appSettings.companyName;
    $('loginBrandSubtitle').textContent = appSettings.companySubtitle;
    $('topBrandHeader').textContent = appSettings.topHeaderSuffix
      ? `${appSettings.companyName} — ${appSettings.topHeaderSuffix}`
      : appSettings.companyName;
  }

  async function loadSettings() {
    try {
      const snap = await get(ref(db, 'settings'));
      if(snap.exists()) {
        applySettingsToUI(snap.val());
      } else {
        await set(ref(db, 'settings'), DEFAULT_SETTINGS);
        applySettingsToUI(DEFAULT_SETTINGS);
      }
    } catch(e) {
      applySettingsToUI(DEFAULT_SETTINGS);
    }
  }

    await loadSettings();

    if(!adminSnap.exists()) {
      const adminRec = {
        username: 'admin',
        name: 'Dono / Administrador',
        role: 'Dono',
        email: 'admin@modagest.co.mz',
        phone: '+258 840000000',
        status: 'ativo',
        createdAt: new Date().toISOString()
      };
      await setPassword(adminRec, 'Admin@123');
      await set(ref(db, 'users/admin'), adminRec);
    }

    // PERSISTÊNCIA DE SESSÃO AUTOMÁTICA APÓS REFRESH DO NAVEGADOR
    const savedUser = localStorage.getItem('modagest_user');
    if(savedUser) {
      try {
        currentUser = JSON.parse(savedUser);
        const savedPage = localStorage.getItem('modagest_page');
        enterApp(false, savedPage);

  // LOGIN
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const u = $('loginUser').value.trim();
    const p = $('loginPass').value;
    const snap = await get(ref(db, 'users'));
    if(!snap.exists()) return toast('Erro de ligação à base de dados.');

    let foundUser = null;
    const candidates = [];
    snap.forEach(child => { candidates.push({ id: child.key, ...child.val() }); });
    for(const usr of candidates) {
      if((usr.username === u || usr.email === u) && await checkPassword(usr, p)) { foundUser = usr; break; }
    }

    if(!foundUser) {
      $('loginMsg').innerHTML = '<div class="alert error">Utilizador ou palavra-passe incorretos.</div>';
      return;
    }
    if(foundUser.status === 'pendente') {
      $('loginMsg').innerHTML = '<div class="alert info">A sua conta está pendente de aprovação pelo Dono.</div>';
      return;
    }
    if(foundUser.status === 'recusado') {
      $('loginMsg').innerHTML = '<div class="alert error">O seu acesso foi recusado pelo administrador.</div>';
      return;
    }

    if(!foundUser.passHash) {
      // Converte conta antiga (texto simples) para hash e remove a palavra-passe da base de dados
      const upd = await setPassword({}, p);
      upd.pass = null;
      await update(ref(db, `users/${foundUser.id}`), upd);
    }
    currentUser = sessionOf(foundUser);
    localStorage.setItem('modagest_user', JSON.stringify(currentUser));
    enterApp(true);
  };

  async function updatePendingBadge() {
    if(!isDono()) return;
    const snap = await get(ref(db, 'users'));
    let pendingCount = 0;
    if(snap.exists()) {
      snap.forEach(c => { if(c.val().status === 'pendente') pendingCount++; });
    }
    $('navUsers').innerHTML = pendingCount > 0
      ? `👥 Aprovar Caixas <span style="background:var(--orange);color:#fff;padding:2px 7px;border-radius:12px;font-size:11px;margin-left:4px">${pendingCount}</span>`
      : `👥 Aprovar Caixas`;

  async function enterApp(isNewLogin = true, savedPage = null) {
    $('loginScreen').style.display = 'none';
    $('app').style.display = 'block';
    $('userLabel').textContent = `${currentUser.name} (${currentUser.role})`;

    if(isDono()) {
      ['navUsers','navSales','navSettings','navExpenses'].forEach(id => $(id).style.display = 'block');
      await updatePendingBadge();
      if(isNewLogin) navigate('dashboard');
      else navigate(savedPage || 'pos');
    } else {
      ['navUsers','navSales','navSettings','navExpenses'].forEach(id => $(id).style.display = 'none');
      navigate('pos');
    }
  }

  async function navigate(page) {
    if(currentUser.role === 'Caixa' && page !== 'pos') {
      return toast('Acesso restrito ao PDV para operadores de caixa.');
    }
    currentPage = page;
    localStorage.setItem('modagest_page', page);
    document.querySelectorAll('#navMenu button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    try {
      if(page === 'dashboard') await renderDashboard();
      else if(page === 'pos') await renderPOS();
      else if(page === 'products') await renderProducts();
      else if(page === 'expenses') await renderExpenses();
      else if(page === 'sales') await renderSalesHistory();
      else if(page === 'users') await renderUsersManagement();
      else if(page === 'settings') await renderSettings();
    } catch(err) { toast('Erro ao carregar módulo: ' + err.message); }
  }

  // Cálculo de uma compra (lote / fardo / pacote)
  function calcPurchase(fd) {
    const packs = num(fd.get('packs'));
    const upp = num(fd.get('upp'));
    const totalUnits = packs * upp;
    const invoice = num(fd.get('invoice'));
    const discount = num(fd.get('discount'));
    const other = num(fd.get('other'));
    const net = invoice - discount + other;
    return {
      packs, upp, totalUnits, invoice, discount, other, net,
      packType: fd.get('packType') || 'pacote',
      unitCost: totalUnits > 0 ? net / totalUnits : 0
    };
  }

  window.openPurchaseModal = function(id) {
    const p = productsCache.find(x => x.id === id);
    if(!p) return;
    $('modalRoot').innerHTML = overlay(`
      <div class="panel" style="width:min(560px,100%);max-height:92vh;overflow:auto;margin:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h3 style="margin:0">Registar Compra / Entrada de Stock</h3>
          <button type="button" class="secondary" style="padding:6px 12px" onclick="fecharModal()">✕</button>
        </div>
        <p class="muted">Produto: <b>${esc(p.name)}</b> &nbsp;|&nbsp; Stock atual: <b>${num(p.stock)} un.</b> &nbsp;|&nbsp; Custo unitário atual: <b>${money(unitCostOf(p))}</b></p>
        <form id="purchaseForm" class="formgrid">
          <div><label>Nº de embalagens</label><input name="packs" type="number" min="0" step="1" value="1" required></div>
          <div><label>Tipo de embalagem</label><select name="packType">${UNIT_TYPES.map(u => `<option ${u === (p.unit || 'pacote') ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
          <div><label>Unidades por embalagem</label><input name="upp" type="number" min="1" step="1" value="${num(p.unitsPerPack) || 1}" required></div>
          <div><label>Valor total da fatura (MT)</label><input name="invoice" type="number" min="0" step="0.01" value="0" required></div>
          <div><label>Desconto na fatura (MT)</label><input name="discount" type="number" min="0" step="0.01" value="0"></div>
          <div><label>Outros custos de aquisição (MT)</label><input name="other" type="number" min="0" step="0.01" value="0"></div>
          <div class="full"><div id="purchasePreview" class="alert info" style="margin:12px 0 0"></div></div>
          <div class="full" style="margin-top:14px;display:flex;gap:10px">
            <button type="button" class="secondary" style="flex:1" onclick="fecharModal()">Cancelar</button>
            <button type="submit" class="success" style="flex:2">Registar compra</button>
          </div>
        </form>
      </div>`);

    const form = $('purchaseForm');
    const preview = () => {
      const c = calcPurchase(new FormData(form));
      $('purchasePreview').innerHTML = `
        Total de unidades: <b>${c.totalUnits}</b> &nbsp;|&nbsp;
        Custo líquido (fatura − desconto + outros): <b>${money(c.net)}</b><br>
        Custo unitário desta compra: <b>${money(c.unitCost)}</b>
        ${num(p.stock) > 0 ? `<br><small>O custo unitário do stock passa a ser a média ponderada entre o stock atual e esta compra.</small>` : ''}`;
    };
    form.oninput = preview;
    preview();

    form.onsubmit = async ev => {
      ev.preventDefault();
      if(isSaving) return;
      const c = calcPurchase(new FormData(form));
      if(c.totalUnits <= 0) return toast('Indique o nº de embalagens e as unidades por embalagem.');
      if(c.net < 0) return toast('O desconto não pode ser maior que a fatura.');
      isSaving = true;
      try {
        const oldStock = num(p.stock), oldCost = unitCostOf(p);
        const newStock = oldStock + c.totalUnits;
        // Custo médio ponderado: mantém o custo unitário do stock correto
        const newCost = newStock > 0 ? r4((oldStock * oldCost + c.net) / newStock) : r4(c.unitCost);
        const iso = new Date().toISOString();
        await push(ref(db, 'purchases'), {
          productId: p.id, productName: p.name,
          packs: c.packs, packType: c.packType, unitsPerPack: c.upp, totalUnits: c.totalUnits,
          invoiceTotal: r2(c.invoice), invoiceDiscount: r2(c.discount), otherCosts: r2(c.other),
          netCost: r2(c.net), unitCost: r4(c.unitCost),
          date: iso, user: currentUser.name
        });
        await update(ref(db, `products/${p.id}`), { stock: newStock, costUnit: newCost, cost: newCost, unitsPerPack: c.upp });
        fecharModal();

  // Upload de imagem (Cloudinary, com plano B na base de dados)
  async function uploadPhoto(file) {
    let blob;
    try { blob = await compressImage(file, 900, 0.8); } catch(e) { blob = file; }
    try {
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
      const data = await res.json();
      if(data.secure_url) return data.secure_url;
      throw new Error((data.error && data.error.message) || 'Resposta inválida');
    } catch(e) {
      console.error('Cloudinary falhou:', e);
      try {
        return await blobToDataURL(await compressImage(file, 360, 0.6));
      } catch(e2) {
        return '';
      }
    }
  }

  function compressImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('compress')), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  // Venda: regista o custo unitário de cada artigo no momento da venda (CMV exato)
  window.checkoutSale = async function() {
    if(cart.length === 0) return toast('O carrinho está vazio.');
    if(isSaving) return;
    const total = sumBy(cart, x => x.price * x.qty);
    let rec = 0, troco = 0;
    if(selectedPayMethod === 'Dinheiro') {
      rec = Number($('cashReceived')?.value) || 0;
      if(rec > 0 && rec < total) return toast('Valor recebido inferior ao total!');
      troco = rec >= total ? rec - total : 0;
    }
    isSaving = true;
    try {
      await loadProducts();
      const items = cart.map(i => {
        const p = productsCache.find(x => x.id === i.id);
        return { ...i, unitCost: p ? r4(unitCostOf(p)) : 0 };
      });
      const totalCost = r2(sumBy(items, i => i.unitCost * i.qty));
      const saleData = {
        items, total: r2(total), totalCost, profit: r2(total - totalCost),
        paymentMethod: selectedPayMethod, cashReceived: rec, changeGiven: troco,
        cashier: currentUser.name, date: new Date().toISOString()
      };
      const refRes = await push(ref(db, 'sales'), saleData);
      for(const i of items) {
        const p = productsCache.find(x => x.id === i.id);
        if(p) await update(ref(db, `products/${i.id}`), { stock: num(p.stock) - i.qty });
      }
      cart = [];
      await renderPOS();
      showReceiptModal({ id: refRes.key, ...saleData });
    } finally { isSaving = false; }
  };

  window.openExpenseModal = function(id = null) {
    const e = id ? expensesCache.find(x => x.id === id) : null;
    expPhoto = e?.photo || '';
    const dateVal = e ? new Date(e.date).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10);
    $('modalRoot').innerHTML = overlay(`
        <div class="panel" style="width:min(540px,100%);max-height:92vh;overflow:auto;margin:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 style="margin:0">${e ? 'Editar Despesa' : 'Nova Despesa'}</h3>
            <button type="button" class="secondary" style="padding:6px 12px" onclick="fecharModal()">✕</button>
          </div>
          <form id="expForm" class="formgrid">
            <div class="full"><label>Título</label><input name="title" required value="${esc(e?.title || '')}" placeholder="Ex: Chapa para o depósito"></div>
            <div><label>Categoria</label><select name="category">${categorySelect(e?.category, expenseCategories)}</select></div>
            <div><label>Tipo</label><select name="type">${Object.entries(EXPENSE_TYPES).map(([k, v]) => `<option value="${k}" ${(e?.type || 'operacional') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>

            <div><label>Data</label><input name="date" type="date" required value="${dateVal}"></div>
            <div class="full"><label>Descrição / observações</label><textarea name="description" rows="2">${esc(e?.description || '')}</textarea></div>

              <label>Comprovativo (opcional)</label>
              <input type="file" id="expImgInput" accept="image/*" style="display:none" onchange="handleExpensePhoto(this)">
              <div class="upload-box" onclick="document.getElementById('expImgInput').click()"><div id="expPhotoBox"></div></div>
            </div>
            <div class="full" style="margin-top:16px;display:flex;gap:10px">
              <button type="button" class="secondary" style="flex:1" onclick="fecharModal()">Cancelar</button>
              <button type="submit" class="success" style="flex:2">Guardar</button>
            </div>
          </form>
        </div>`);
    updateExpPhotoBox();
    $('expForm').onsubmit = async ev => {
      ev.preventDefault();
      if(isUploadingExpense) return toast('Aguarde o envio do comprovativo...');
      if(isSaving) return;
      const f = new FormData(ev.target);
      const amount = r2(f.get('amount'));
      if(amount < 0) return toast('O valor não pode ser negativo.');
      isSaving = true;
      try {
        const iso = new Date(f.get('date') + 'T12:00:00').toISOString();
        const data = {
          title: f.get('title').trim(),
          category: f.get('category'),
          type: f.get('type'),
          amount, date: iso,
          description: f.get('description').trim(),
          responsavel: currentUser.name,
          photo: expPhoto || '',
          updatedAt: new Date().toISOString()
        };
        if(e) await update(ref(db, `expenses/${e.id}`), data);
        else { data.createdAt = new Date().toISOString(); await push(ref(db, 'expenses'), data); }
        fecharModal();
        toast('Despesa guardada!');
        await renderExpenses();
      } finally { isSaving = false; }
    };
  };

  // ---------- HISTÓRICO, ESTORNO E ARQUIVO ----------
  window.estornarVenda = async function(id) {
    if(!isDono()) return;
    if(!await confirmDono('Estornar esta venda? O stock será devolvido e a venda deixa de contar nos totais. O registo fica guardado.')) return;
    await loadProducts();
    await loadSales();
    const s = salesCache.find(x => x.id === id);
    if(!s || s.estornada) return;
    for(const i of (s.items || [])) {
      const p = productsCache.find(x => x.id === i.id);
      if(p) await update(ref(db, `products/${p.id}`), { stock: num(p.stock) + num(i.qty) });
    }
    await update(ref(db, `sales/${id}`), { estornada: true, estornadaEm: new Date().toISOString(), estornadaPor: currentUser.name });
    toast('Venda estornada e stock devolvido.');
    await renderSalesHistory();
  };

  window.arquivarPeriodo = async function() {
    if(!isDono()) return;
    const list = filterSalesByPeriod(salesCache, currentReportFilter);
    if(list.length === 0) return toast('Não há vendas ativas neste período para arquivar.');
    if(!await confirmDono(`Arquivar ${list.length} venda(s) deste período? Ficam guardadas, mas saem dos totais e relatórios.`)) return;
    const iso = new Date().toISOString();
    for(const s of list) await update(ref(db, `sales/${s.id}`), { archived: true, archivedAt: iso, archivedBy: currentUser.name });
    toast(`${list.length} venda(s) arquivada(s).`);
    await renderSalesHistory();
  };

    await renderSalesHistory();
  };

  function buildSalesVia(type, list, viaLabel) {
    const S = summarizeSales(list);

    const prod = {};
    active.forEach(s => (s.items || []).forEach(i => {
      const k = `${i.name}|${i.size}|${i.color}`;
      if(!prod[k]) prod[k] = { name: i.name, size: i.size, color: i.color, qty: 0, total: 0 };
      prod[k].qty += num(i.qty);
      prod[k].total += num(i.price) * num(i.qty);
    }));
    const prodRows = Object.values(prod).sort((a, b) => b.qty - a.qty).map(p =>
      `<tr><td>${esc(p.name)}</td><td>${esc(p.size)} / ${esc(p.color)}</td><td style="text-align:right">${p.qty}</td><td style="text-align:right">${money(p.total)}</td></tr>`).join('');

        <div style="color:#667789">${esc(appSettings.topHeaderSuffix)}</div>
        <h3 style="margin:10px 0 2px;font-size:16px">Relatório de Despesas — ${esc(periodLabel(type))}</h3>
        <div style="color:#667789">Período: <b>${esc(periodLabel(type))}</b> &nbsp;|&nbsp; Emitido em ${new Date().toLocaleString('pt-MZ')} por ${esc(currentUser ? currentUser.name : '')}</div>
      </div>
      <table class="rep-table" style="margin-bottom:14px">
        <thead><tr><th>Categoria</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>
          ${catRows}
          <tr style="font-weight:800;background:#f5f8fb"><td>TOTAL DESPESAS OPERACIONAIS</td><td style="text-align:right">${money(sumBy(opex, e => e.amount))}</td></tr>
          <tr><td colspan="2" style="color:#667789">Despesas de aquisição (não somadas: já estão no custo do stock): ${money(sumBy(aq, e => e.amount))}</td></tr>
        </tbody>
      </table>
      <h4 style="margin:14px 0 6px">Lançamentos (${list.length})</h4>
      <table class="rep-table">
        <thead><tr><th>Nº</th><th>Data</th><th>Título</th><th>Categoria</th><th>Tipo</th><th>Responsável</th><th style="text-align:right">Valor</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7">Sem despesas neste período.</td></tr>'}</tbody>
      </table>
    </div>`;
  }

  function buildReportDocument(kind, type, list) {
    const build = kind === 'despesas' ? buildExpensesVia : buildSalesVia;
    return build(type, list, 'VIA 1 — PASTA DE RELATÓRIOS')
      + '<div class="html2pdf__page-break"></div>'
      + build(type, list, 'VIA 2 — DONO');
  }

  async function getReportList(kind, type) {
    if(kind === 'despesas') {
      await loadExpenses();
      return expensesCache.filter(e => inPeriod(e.date, type)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    }
    await loadSales();
    return filterSalesByPeriod(salesCache, type);
  }

  // Abre a pré-visualização com as duas vias (Via 1 Pasta de Relatórios, Via 2 Dono)
  async function openReport(kind, type) {
    type = REPORT_TITLES[type] ? type : 'diario';
    toast('A preparar relatório...');
    const list = await getReportList(kind, type);
    if(list.length === 0) return toast('Não há registos neste período para imprimir.');

    document.body.classList.add('printing-report');
    $('modalRoot').innerHTML = `
      <div class="print-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);overflow:auto;padding:15px;z-index:99">
        <div style="background:#fff;max-width:900px;margin:0 auto;padding:28px;border-radius:12px">
          <div class="no-print" style="display:flex;gap:10px;justify-content:flex-end;margin-bottom:16px">
            <button type="button" class="secondary" onclick="fecharModal()">Fechar</button>
            <button type="button" class="warning" onclick="savePDF('${kind}','${type}')">💾 Salvar PDF</button>
            <button type="button" class="success" onclick="window.print()">🖨️ Imprimir (2 vias)</button>
          </div>
          <div id="printReportModal">${buildReportDocument(kind, type, list)}</div>
        </div>
      </div>`;
  }

  window.printReport = (type) => openReport('vendas', type);
  window.printExpenses = (type) => openReport('despesas', type);

  function loadHtml2Pdf() {
    if(window.html2pdf) return Promise.resolve(window.html2pdf);
    return new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      sc.onload = () => resolve(window.html2pdf);
      sc.onerror = () => reject(new Error('não foi possível carregar o gerador de PDF (verifique a ligação à internet)'));
      document.head.appendChild(sc);
    });
  }

  window.savePDF = async function(kind, type) {
    type = REPORT_TITLES[type] ? type : 'diario';
    let holder = null;
    try {
      toast('A gerar PDF...');
      const list = await getReportList(kind, type);
      if(list.length === 0) return toast('Não há registos neste período.');
      const html2pdf = await loadHtml2Pdf();

      holder = document.createElement('div');
      holder.style.cssText = 'position:absolute;left:-10000px;top:0;width:794px;background:#fff;';
      holder.innerHTML = buildReportDocument(kind, type, list);
      document.body.appendChild(holder);

      const periodo = periodLabel(type).replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, '_');
      const tipo = kind === 'despesas' ? 'Despesas' : 'Vendas';
      const fileName = `${(appSettings.companyName || 'Loja').replace(/\s+/g, '_')}_${tipo}_${REPORT_FILE[type]}_${periodo}.pdf`;

      await html2pdf().set({
        margin: [12, 12, 12, 12],
        filename: fileName,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'] }
      }).from(holder).save();

      toast('PDF guardado: ' + fileName);
    } catch(e) {
      toast('Erro ao gerar PDF: ' + e.message);
    } finally {
      if(holder) holder.remove();
    }
  };

  // ---------- VISÃO GERAL ----------
  window.setDashPeriod = async function(t) { dashPeriod = t; await renderDashboard(); };
  window.resetDashboard = async function() { dashPeriod = 'mensal'; await renderDashboard(); toast('Filtros repostos: Mês atual.'); };

  function dashLine(label, value, color) {
    return `<div class="dash-line"><span class="muted">${label}</span><b${color ? ` style="color:${color}"` : ''}>${value}</b></div>`;
  }

  async function renderDashboard() {
    await loadProducts();
    await loadSales();
    await loadPurchases();
    await loadExpenses();
    await updatePendingBadge();
    const t = dashPeriod;

    const S = summarizeSales(filterSalesByPeriod(salesCache, t));
    const purch = purchasesCache.filter(p => inPeriod(p.date, t));
    const invoice = sumBy(purch, p => p.invoiceTotal);
    const discount = sumBy(purch, p => p.invoiceDiscount);
    const other = sumBy(purch, p => p.otherCosts);
    const netInvest = sumBy(purch, p => p.netCost);

    const stockValue = sumBy(productsCache, p => num(p.stock) * unitCostOf(p));
    const esgotados = productsCache.filter(p => num(p.stock) <= 0);
    const baixos = productsCache.filter(p => num(p.stock) > 0 && num(p.stock) <= STOCK_BAIXO);
    const reposicao = sumBy(productsCache.filter(p => num(p.stock) <= STOCK_BAIXO), p => Math.max(0, REPOSICAO_IDEAL - num(p.stock)) * unitCostOf(p));

    const exps = expensesCache.filter(e => inPeriod(e.date, t));
    const opexList = exps.filter(e => e.type !== 'aquisicao');
    const opex = sumBy(opexList, e => e.amount);
    const aqExp = sumBy(exps.filter(e => e.type === 'aquisicao'), e => e.amount);
    const lucroLiquido = S.lucro - opex;

    const topCats = S.byCategory.slice(0, 3).map(([c, v]) => dashLine(esc(c), money(v))).join('') || '<div class="muted" style="font-size:13px">Sem vendas neste período.</div>';
    const expByCat = {};
    opexList.forEach(e => { const c = e.category || 'Sem categoria'; expByCat[c] = (expByCat[c] || 0) + num(e.amount); });
    const topExp = Object.entries(expByCat).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([c, v]) => dashLine(esc(c), money(v))).join('') || '<div class="muted" style="font-size:13px">Sem despesas operacionais.</div>';

    $('contentArea').innerHTML = head('Visão Geral', `<div style="display:flex;gap:8px;flex-wrap:wrap">
        ${periodButtons(t, 'setDashPeriod')}
        <button class="secondary" style="padding:7px 14px;font-size:13px" onclick="resetDashboard()">↺ Limpar filtros</button></div>`) + `
    <div class="dash-grid">
      <div class="dash-card">
        <h3>1. Investimento em stock</h3>
        <div class="dash-big">${money(netInvest)}</div>
        <div class="muted">investido em compras no período</div>
        <div style="margin-top:10px">${dashLine('Stock atual a custo', money(stockValue))}${dashLine('Compras registadas', purch.length + ' compra(s)')}</div>
        <div class="dash-legend">Custo líquido de cada compra = fatura − desconto + outros custos de aquisição. O "stock atual" usa o custo unitário médio de cada artigo.</div>
      </div>

      <div class="dash-card">
        <h3>2. Desconto na fatura</h3>
        <div class="dash-big" style="color:var(--green)">${money(discount)}</div>
        <div class="muted">desconto obtido no período</div>
        <div style="margin-top:10px">${dashLine('Valor da fatura (antes do desconto)', money(invoice))}${dashLine('Outros custos de aquisição', money(other))}${dashLine('Custo após desconto', money(netInvest), 'var(--navy)')}</div>
        <div class="dash-legend">Se não houver compras no período, todos os valores ficam em 0,00 MT.</div>
      </div>

      <div class="dash-card">
        <h3>3. Faturamento do produto</h3>
        <div class="dash-big">${money(S.fat)}</div>
        <div class="muted">${S.n} venda(s) ativa(s)</div>
        <div style="margin-top:10px">${dashLine('Dinheiro', money(S.byMethod[0].t))}${dashLine('M-Pesa', money(S.byMethod[1].t))}${dashLine('e-Mola', money(S.byMethod[2].t))}${dashLine('mKesh', money(S.byMethod[3].t))}</div>
        <div style="margin-top:8px;font-size:12px;font-weight:700;color:var(--navy)">Maiores categorias</div>
        ${topCats}
        <div class="dash-legend">Só vendas ativas. Vendas estornadas ou arquivadas não entram.</div>
      </div>

      <div class="dash-card">
        <h3>4. CMV e lucro do produto</h3>
        <div class="dash-big" style="color:var(--green)">${money(S.lucro)}</div>
        <div class="muted">lucro bruto · margem ${pct(S.margem)}</div>
        <div style="margin-top:10px">${dashLine('CMV (custo das vendas)', money(S.cmv))}${dashLine('Faturamento', money(S.fat))}</div>
        ${S.semCusto ? `<div class="alert info" style="margin:10px 0 0;font-size:12px">${S.semCusto} venda(s) anterior(es) não têm custo registado; o CMV dessas vendas está em 0,00 MT.</div>` : ''}
        <div class="dash-legend">CMV = quantidade vendida × custo unitário no momento da venda. Lucro = faturamento − CMV. Margem = lucro ÷ faturamento.</div>
      </div>

      <div class="dash-card">
        <h3>5. Dinheiro para repor stock</h3>
        <div class="dash-big" style="color:${reposicao > 0 ? 'var(--red)' : 'var(--green)'}">${money(reposicao)}</div>
        <div class="muted">valor estimado para repor (stock atual)</div>
        <div style="margin-top:10px">${dashLine('Esgotados', esgotados.length + ' artigo(s)', 'var(--red)')}${dashLine(`Stock baixo (≤ ${STOCK_BAIXO})`, baixos.length + ' artigo(s)', 'var(--orange)')}</div>
        <div class="dash-legend">Reposição = (${REPOSICAO_IDEAL} − stock atual) × custo unitário, para artigos com stock ≤ ${STOCK_BAIXO}. Não depende do período.</div>
      </div>

      <div class="dash-card">
        <h3>6. Despesas e lucro líquido operacional</h3>
        <div class="dash-big" style="color:${lucroLiquido >= 0 ? 'var(--green)' : 'var(--red)'}">${money(lucroLiquido)}</div>
        <div class="muted">lucro líquido operacional</div>
        <div style="margin-top:10px">${dashLine('Lucro bruto', money(S.lucro))}${dashLine('Despesas operacionais', money(opex), 'var(--red)')}${dashLine('Despesas de aquisição (não contabilizadas)', money(aqExp), 'var(--muted)')}</div>
        <div style="margin-top:8px;font-size:12px;font-weight:700;color:var(--navy)">Maiores despesas</div>
        ${topExp}
        <div class="dash-legend">Lucro líquido = lucro bruto − despesas operacionais. As despesas de aquisição não entram para evitar dupla contagem com as compras de stock.</div>
      </div>
    </div>
    <div class="panel"><h3>Bem-vindo ao ${esc(appSettings.companyName)}</h3><p class="muted">Use o menu lateral para o Caixa, o Stock, as Despesas, o Histórico e as Definições. Os números desta página respeitam o período escolhido no topo.</p></div>`;
  }
</script>
</body>
</html>
