<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">ModaGest — Sistema de Gestão para Lojas</title>
<style>
:root{
  --navy:#173b63;
  --blue:#245b91;
  --bg:#f2f5f9;
  --ink:#1c2733;
  --muted:#667789;
  --line:#dce3eb;
  --green:#16865d;
  --red:#c33d45;
  --orange:#d97706;
  --panel-bg:#ffffff;
  --th-bg:#f5f8fb;
  --th-ink:#43576b;
  --tr-hover:#fafcff;
}
*{box-sizing:border-box}
body{margin:0;font:14px "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 16px;background:var(--blue);color:white;font-weight:600;transition:opacity .2s}
button:hover{opacity:.9}
button.secondary{background:#e7edf4;color:#24415e}
button.danger{background:var(--red)}
button.success{background:var(--green)}
button.warning{background:var(--orange)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5df;border-radius:7px;background:#fff;color:var(--ink)}
input[type="color"]{padding:2px;height:40px;cursor:pointer}
label{display:block;font-weight:600;margin:9px 0 5px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%)}
.login-card{background:var(--panel-bg);width:min(440px,100%);padding:35px;border-radius:16px;box-shadow:0 15px 50px rgba(0,0,0,.2)}
.brand{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:4px;letter-spacing:.5px}
.muted{color:var(--muted);font-size:13px}
#app{display:none;min-height:100vh}
.top{height:65px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.top strong{font-size:20px;letter-spacing:.5px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 65px)}
nav{background:var(--panel-bg);border-right:1px solid var(--line);padding:20px 12px}
nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:var(--ink);font-weight:600;padding:12px 14px;border-radius:8px}
nav button.active,nav button:hover{background:#e9f1fa;color:var(--navy)}
main{padding:25px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.pagehead h1{font-size:22px;margin:0;color:var(--navy)}
.panel{background:var(--panel-bg);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.panel h3{margin:0 0 15px;color:var(--navy)}
table{border-collapse:collapse;width:100%}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--th-bg);color:var(--th-ink);font-size:12px;text-transform:uppercase}
tr:hover td{background:var(--tr-hover)}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}
.full{grid-column:1/-1}
.alert{padding:12px 14px;border-radius:8px;margin:12px 0;font-size:13px}
.error{background:#ffebeb;color:#a3272e}
.successmsg{background:#e7f7ef;color:#176b48}
.info{background:#eef4fc;color:#1d4ed8}
.toast{position:fixed;right:25px;bottom:25px;background:var(--navy);color:white;padding:14px 20px;border-radius:10px;z-index:99;box-shadow:0 6px 25px rgba(0,0,0,.2);font-weight:600}
.product-img{width:48px;height:48px;object-fit:cover;border-radius:7px;border:1px solid var(--line);background:#f5f8fb;display:block}
.badge-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}

/* Caixa de Upload Estilo Galeria */
.upload-box{border:2px dashed #b6c6d8;border-radius:12px;padding:22px 15px;text-align:center;background:#f8fafd;cursor:pointer;transition:all .2s;margin-top:6px}
.upload-box:hover{border-color:var(--blue);background:#eef4fc}
.upload-icon{width:38px;height:38px;color:var(--blue);margin:0 auto 8px}
.upload-title{font-weight:700;font-size:15px;color:var(--navy);margin-bottom:4px}
.upload-sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.upload-badge{display:inline-block;background:#e7f7ef;color:#16865d;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.preview-wrap{position:relative;display:inline-block;margin-top:5px}
.preview-img{max-width:100%;max-height:170px;border-radius:9px;border:1px solid var(--line);display:block;margin:0 auto}

/* Estilos do PDV / Caixa */
.pos-layout{display:grid;grid-template-columns:1fr 390px;gap:20px;align-items:start}
.pos-catalog{display:grid;grid-template-columns:repeat(auto-fill, minmax(155px, 1fr));gap:12px;max-height:70vh;overflow:auto;padding:2px}
.pos-tile{background:var(--panel-bg);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;transition:all .2s;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.pos-tile:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(36,91,145,.15);transform:translateY(-2px)}
.pos-tile img{width:100%;height:110px;object-fit:cover;border-radius:6px;background:#f5f8fb;margin-bottom:8px}
.noimg-box{display:grid;place-items:center;font-size:10px;color:#888;background:#eef4fc;border-radius:6px}
.pos-tile .noimg-box{width:100%;height:110px;margin-bottom:8px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pay-methods{display:grid;grid-template-columns:repeat(2, 1fr);gap:8px;margin:10px 0}
.pay-btn{background:#e7edf4;color:#24415e;border:1px solid #cbd5df;padding:10px;font-size:13px;font-weight:600;border-radius:8px;text-align:center;cursor:pointer}
.pay-btn.active{background:var(--navy);color:white;border-color:var(--navy)}
.troco-box{background:#f5f8fb;border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}

/* ESTILO EXCLUSIVO PARA IMPRESSÃO DE TALÃO */
@media print {
  body * { visibility: hidden; }
  #printReceiptModal, #printReceiptModal * { visibility: visible; }
  #printReceiptModal { position: absolute; inset: 0; background: #fff !important; padding: 0 !important; margin: 0 !important; width: 100% !important; box-shadow: none !important; border: none !important; }
  .no-print { display: none !important; }
}

@media(max-width:960px){.pos-layout{grid-template-columns:1fr}.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav button{min-width:140px}}
@media(max-width:560px){.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ECRÃ DE LOGIN / REGISTO -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand" id="loginBrandName">ModaGest</div>
    <div class="muted" id="loginBrandSubtitle">Gestão Inteligente para Lojas em Moçambique</div>
    <div id="loginMsg"></div>
    <form id="loginForm" style="margin-top:20px">
      <label>E-mail ou Utilizador</label><input id="loginUser" required placeholder="Ex: admin ou seu@email.com">
      <label>Palavra-passe</label><input id="loginPass" type="password" required placeholder="••••••••">
      <button type="submit" style="width:100%;margin-top:18px">Entrar no Sistema</button>
    </form>
    <div style="text-align:center;margin-top:18px;border-top:1px solid var(--line);padding-top:15px">
      <span class="muted">Não tem conta de Caixa?</span><br>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="showRegisterModal()">Registar nova conta de Caixa</button>
    </div>
  </div>
</div>

<!-- APLICAÇÃO PRINCIPAL -->
<div id="app">
  <header class="top">
    <strong id="topBrandHeader">ModaGest — Moçambique</strong>
    <span style="display:flex;align-items:center;gap:8px">
      <span id="userLabel"></span>
      <button class="secondary" onclick="atualizarDadosSistema()" style="padding:6px 12px;font-size:13px" title="Atualizar dados sem sair">🔄 Atualizar</button>
      <button class="secondary" id="logoutBtn" style="padding:6px 12px;font-size:13px">Sair</button>
    </span>
  </header>
  <div class="shell">
    <nav id="navMenu">
      <button class="active" data-page="dashboard">▦ Visão Geral</button>
      <button data-page="pos">▣ Caixa / PDV</button>
      <button data-page="products">▤ Produtos e Stock</button>
      <button data-page="sales" id="navSales" style="display:none">💵 Histórico e Fecho</button>
      <button data-page="users" id="navUsers" style="display:none">👥 Aprovar Caixas</button>
      <button data-page="settings" id="navSettings" style="display:none">⚙️ Definições</button>
    </nav>
    <main id="contentArea"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { databaseURL: "https://amigo-de-qualidade-default-rtdb.firebaseio.com" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const CLOUD_NAME = "t45tpzth";
  const UPLOAD_PRESET = "Amigo de qualidade";

  const DEFAULT_SETTINGS = {
    companyName: "ModaGest",
    companySubtitle: "Gestão Inteligente para Lojas em Moçambique",
    topHeaderSuffix: "Moçambique",
    navyColor: "#173b63",
    blueColor: "#245b91",
    bgColor: "#f2f5f9",
    inkColor: "#1c2733",
    panelBgColor: "#ffffff",
    thBgColor: "#f5f8fb",
    thInkColor: "#43576b",
    lineColor: "#dce3eb"
  };

  let appSettings = { ...DEFAULT_SETTINGS };
  let isUploadingImage = false;
  let currentUser = null, productsCache = [], salesCache = [], cart = [], tempImageData = '', selectedPayMethod = 'Dinheiro', currentReportFilter = 'diario', currentPage = 'dashboard';
  const $ = id => document.getElementById(id);
  const money = n => (Number(n) || 0).toLocaleString('pt-MZ', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' MT';
  function toast(msg) { $('toastRoot').innerHTML = `<div class="toast">${msg}</div>`; setTimeout(() => $('toastRoot').innerHTML = '', 3500); }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  window.fecharModal = function() {
    $('modalRoot').innerHTML = '';
  };

  window.atualizarDadosSistema = async function() {
    toast('A sincronizar dados...');
    await loadSettings();
    await navigate(currentPage);
    toast('Sistema atualizado!');
  };

  function applySettingsToUI(cfg) {
    appSettings = { ...DEFAULT_SETTINGS, ...cfg };
    const r = document.documentElement.style;
    r.setProperty('--navy', appSettings.navyColor);
    r.setProperty('--blue', appSettings.blueColor);
    r.setProperty('--bg', appSettings.bgColor);
    r.setProperty('--ink', appSettings.inkColor);
    r.setProperty('--panel-bg', appSettings.panelBgColor);
    r.setProperty('--th-bg', appSettings.thBgColor);
    r.setProperty('--th-ink', appSettings.thInkColor);
    r.setProperty('--line', appSettings.lineColor);

    $('pageTitle').textContent = `${appSettings.companyName} — Sistema de Gestão`;
    $('loginBrandName').textContent = appSettings.companyName;
    $('loginBrandSubtitle').textContent = appSettings.companySubtitle;
    $('topBrandHeader').textContent = appSettings.topHeaderSuffix
      ? `${appSettings.companyName} — ${appSettings.topHeaderSuffix}`
      : appSettings.companyName;
  }

  async function loadSettings() {
    try {
      const snap = await get(ref(db, 'settings'));
      if(snap.exists()) {
        applySettingsToUI(snap.val());
      } else {
        await set(ref(db, 'settings'), DEFAULT_SETTINGS);
        applySettingsToUI(DEFAULT_SETTINGS);
      }
    } catch(e) {
      applySettingsToUI(DEFAULT_SETTINGS);
    }
  }

  async function initSystem() {
    await loadSettings();
    const adminSnap = await get(ref(db, 'users/admin'));
    if(!adminSnap.exists()) {
      await set(ref(db, 'users/admin'), {
        username: 'admin',
        name: 'Dono / Administrador',
        role: 'Dono',
        email: 'admin@modagest.co.mz',
        phone: '+258 840000000',
        pass: 'Admin@123',
        status: 'ativo',
        createdAt: new Date().toISOString()
      });
    }

    // PERSISTÊNCIA DE SESSÃO AUTOMÁTICA APÓS REFRESH DO NAVEGADOR
    const savedUser = localStorage.getItem('modagest_user');
    if(savedUser) {
      try {
        currentUser = JSON.parse(savedUser);
        const savedPage = localStorage.getItem('modagest_page');
        enterApp(false, savedPage);
      } catch(e) {
        localStorage.removeItem('modagest_user');
        localStorage.removeItem('modagest_page');
      }
    }
  }
  initSystem();

  // LOGIN
  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    const u = $('loginUser').value.trim();
    const p = $('loginPass').value;
    const snap = await get(ref(db, 'users'));
    if(!snap.exists()) return toast('Erro de ligação à base de dados.');

    let foundUser = null;
    snap.forEach(child => {
      let usr = child.val();
      if((usr.username === u || usr.email === u) && usr.pass === p) {
        foundUser = { id: child.key, ...usr };
      }
    });

    if(!foundUser) {
      $('loginMsg').innerHTML = '<div class="alert error">Utilizador ou palavra-passe incorretos.</div>';
      return;
    }
    if(foundUser.status === 'pendente') {
      $('loginMsg').innerHTML = '<div class="alert info">A sua conta está pendente de aprovação pelo Dono.</div>';
      return;
    }
    if(foundUser.status === 'recusado') {
      $('loginMsg').innerHTML = '<div class="alert error">O seu acesso foi recusado pelo administrador.</div>';
      return;
    }

    currentUser = foundUser;
    localStorage.setItem('modagest_user', JSON.stringify(currentUser));
    enterApp(true);
  };

  async function updatePendingBadge() {
    if(!currentUser || currentUser.role !== 'Dono') return;
    const snap = await get(ref(db, 'users'));
    let pendingCount = 0;
    if(snap.exists()) {
      snap.forEach(c => { if(c.val().status === 'pendente') pendingCount++; });
    }
    $('navUsers').innerHTML = pendingCount > 0 
      ? `👥 Aprovar Caixas <span style="background:var(--orange);color:#fff;padding:2px 7px;border-radius:12px;font-size:11px;margin-left:4px">${pendingCount}</span>` 
      : `👥 Aprovar Caixas`;
  }

  async function enterApp(isNewLogin = true, savedPage = null) {
    $('loginScreen').style.display = 'none';
    $('app').style.display = 'block';
    $('userLabel').textContent = `${currentUser.name} (${currentUser.role})`;
    
    if(currentUser.role === 'Dono') {
      $('navUsers').style.display = 'block';
      $('navSales').style.display = 'block';
      $('navSettings').style.display = 'block';
      await updatePendingBadge();
      if(isNewLogin) navigate('dashboard');
      else navigate(savedPage || 'pos');
    } else {
      $('navUsers').style.display = 'none';
      $('navSales').style.display = 'none';
      $('navSettings').style.display = 'none';
      navigate('pos');
    }
  }

  $('logoutBtn').onclick = () => {
    currentUser = null;
    localStorage.removeItem('modagest_user');
    localStorage.removeItem('modagest_page');
    $('app').style.display = 'none';
    $('loginScreen').style.display = 'grid';
    $('loginForm').reset();
    $('loginMsg').innerHTML = '';
  };

  document.querySelectorAll('#navMenu button').forEach(btn => {
    btn.onclick = () => navigate(btn.dataset.page);
  });

  async function navigate(page) {
    if(currentUser.role === 'Caixa' && page !== 'pos') {
      return toast('Acesso restrito ao PDV para operadores de caixa.');
    }
    currentPage = page;
    localStorage.setItem('modagest_page', page);
    document.querySelectorAll('#navMenu button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    try {
      if(page === 'dashboard') await renderDashboard();
      else if(page === 'pos') await renderPOS();
      else if(page === 'products') await renderProducts();
      else if(page === 'sales') await renderSalesHistory();
      else if(page === 'users') await renderUsersManagement();
      else if(page === 'settings') await renderSettings();
    } catch(err) { toast('Erro ao carregar módulo: ' + err.message); }
  }

  function head(title, action='') { return `<div class="pagehead"><h1>${title}</h1>${action}</div>`; }

  // DEFINIÇÕES E PERSONALIZAÇÃO
  async function renderSettings() {
    await loadSettings();
    let html = head('Definições e Personalização do Sistema');
    html += `
    <form id="settingsForm">
      <div class="panel">
        <h3>1. Identidade da Empresa / Loja</h3>
        <p class="muted" style="margin-top:-8px;margin-bottom:14px">Altere o nome da empresa caso mude de marca ou transfira o sistema para outra pessoa.</p>
        <div class="formgrid">
          <div><label>Nome da Empresa / Loja</label><input name="companyName" value="${esc(appSettings.companyName)}" required placeholder="Ex: Amigo de Qualidade"></div>
          <div><label>Localização / Subtítulo do Topo</label><input name="topHeaderSuffix" value="${esc(appSettings.topHeaderSuffix)}" placeholder="Ex: Pemba - Moçambique"></div>
          <div class="full"><label>Slogan / Descrição no Ecrã de Login</label><input name="companySubtitle" value="${esc(appSettings.companySubtitle)}" placeholder="Ex: Gestão Inteligente para Lojas"></div>
        </div>
      </div>
      <div class="panel">
        <h3>2. Cores do Sistema e Tabelas</h3>
        <div class="formgrid">
          <div><label>Cor Principal</label><input type="color" name="navyColor" value="${esc(appSettings.navyColor)}"></div>
          <div><label>Cor dos Botões</label><input type="color" name="blueColor" value="${esc(appSettings.blueColor)}"></div>
          <div><label>Cor do Texto</label><input type="color" name="inkColor" value="${esc(appSettings.inkColor)}"></div>
          <div><label>Cor de Fundo Geral</label><input type="color" name="bgColor" value="${esc(appSettings.bgColor)}"></div>
          <div><label>Cor de Fundo dos Painéis</label><input type="color" name="panelBgColor" value="${esc(appSettings.panelBgColor)}"></div>
          <div><label>Cor das Linhas</label><input type="color" name="lineColor" value="${esc(appSettings.lineColor)}"></div>
          <div><label>Cor Fundo Cabeçalho Tabela</label><input type="color" name="thBgColor" value="${esc(appSettings.thBgColor)}"></div>
          <div><label>Cor Texto Cabeçalho Tabela</label><input type="color" name="thInkColor" value="${esc(appSettings.thInkColor)}"></div>
        </div>
      </div>
      <div class="panel">
        <h3>3. Dados de Acesso do Dono</h3>
        <div class="formgrid">
          <div><label>Nome do Dono</label><input name="ownerName" value="${esc(currentUser.name)}" required></div>
          <div><label>Utilizador</label><input name="ownerUsername" value="${esc(currentUser.username)}" required></div>
          <div><label>E-mail</label><input name="ownerEmail" type="email" value="${esc(currentUser.email || '')}" required></div>
          <div><label>Palavra-passe</label><input name="ownerPass" type="text" value="${esc(currentUser.pass)}" required></div>
        </div>
      </div>
      <button type="submit" class="success" style="padding:13px 24px;font-size:15px">Guardar Definições</button>
    </form>`;

    $('contentArea').innerHTML = html;
    $('settingsForm').oninput = () => {
      const f = new FormData($('settingsForm'));
      applySettingsToUI({
        companyName: f.get('companyName') || appSettings.companyName,
        topHeaderSuffix: f.get('topHeaderSuffix'),
        companySubtitle: f.get('companySubtitle'),
        navyColor: f.get('navyColor'),
        blueColor: f.get('blueColor'),
        inkColor: f.get('inkColor'),
        bgColor: f.get('bgColor'),
        panelBgColor: f.get('panelBgColor'),
        lineColor: f.get('lineColor'),
        thBgColor: f.get('thBgColor'),
        thInkColor: f.get('thInkColor')
      });
    };
    $('settingsForm').onsubmit = async ev => {
      ev.preventDefault();
      const f = new FormData(ev.target);
      const newCfg = {
        companyName: f.get('companyName').trim(),
        topHeaderSuffix: f.get('topHeaderSuffix').trim(),
        companySubtitle: f.get('companySubtitle').trim(),
        navyColor: f.get('navyColor'),
        blueColor: f.get('blueColor'),
        inkColor: f.get('inkColor'),
        bgColor: f.get('bgColor'),
        panelBgColor: f.get('panelBgColor'),
        lineColor: f.get('lineColor'),
        thBgColor: f.get('thBgColor'),
        thInkColor: f.get('thInkColor')
      };
      await set(ref(db, 'settings'), newCfg);
      applySettingsToUI(newCfg);
      const ownerUpdates = { name: f.get('ownerName').trim(), username: f.get('ownerUsername').trim(), email: f.get('ownerEmail').trim(), pass: f.get('ownerPass') };
      await update(ref(db, `users/${currentUser.id}`), ownerUpdates);
      currentUser = { ...currentUser, ...ownerUpdates };
      localStorage.setItem('modagest_user', JSON.stringify(currentUser));
      $('userLabel').textContent = `${currentUser.name} (${currentUser.role})`;
      toast('Definições guardadas com sucesso!');
    };
  }

  // REGISTO DE CAIXA
  window.showRegisterModal = function() {
    $('modalRoot').innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);display:grid;place-items:center;padding:15px;z-index:99">
        <div class="panel" style="width:min(500px,100%);margin:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
            <h3 style="margin:0">Registar Conta de Caixa</h3>
            <button type="button" class="secondary" style="padding:6px 12px" onclick="fecharModal()">✕</button>
          </div>
          <form id="regForm">
            <label>Nome Completo</label><input name="name" required placeholder="Ex: Maria José">
            <label>E-mail</label><input name="email" type="email" required placeholder="maria@email.com">
            <label>Contacto</label><input name="phone" required placeholder="+258 84...">
            <label>Palavra-passe</label><input name="pass" type="password" required placeholder="Mínimo 6 caracteres">
            <div style="display:flex;gap:10px;margin-top:18px">
              <button type="button" class="secondary" style="flex:1" onclick="fecharModal()">Cancelar</button>

  window.handleImageSelect = async function(input) {
    const file = input.files[0];
    if(!file) return;
    const box = $('uploadBoxContent');
    if(box) box.innerHTML = `<div style="padding:15px;color:var(--navy);font-weight:600">A enviar foto para a nuvem...</div>`;
    isUploadingImage = true;
    // Reduz a foto antes de enviar (mais rápido e funciona com dados móveis)
    let blob;
    try { blob = await compressImage(file, 900, 0.8); } catch(e) { blob = file; }
    try {
      const fd = new FormData();
      fd.append('file', blob);
      fd.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
      const data = await res.json();
      if(data.secure_url) {
        tempImageData = data.secure_url;
        toast('Foto enviada com sucesso!');
      } else {
        throw new Error((data.error && data.error.message) || 'Resposta inválida');
      }
    } catch(e) {
      console.error('Cloudinary falhou:', e);
      // Plano B: guarda a foto reduzida diretamente na base de dados
      try {
        tempImageData = await blobToDataURL(await compressImage(file, 500, 0.7));
        toast('Cloudinary indisponível (' + e.message + '). Foto guardada diretamente.');
      } catch(e2) {
        tempImageData = '';
        toast('Erro ao processar a imagem.');
      }
    }
    isUploadingImage = false;
    updateUploadBoxUI();
    input.value = '';
  };

  function compressImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => b ? resolve(b) : reject(new Error('compress')), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }

  function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  window.addToCart = function(id) {
    const p = productsCache.find(x => x.id === id);
    if(!p || p.stock <= 0) return toast('Artigo esgotado!');
    const ex = cart.find(x => x.id === id);
    if(ex) {
      if(ex.qty >= p.stock) return toast('Stock máximo atingido!');
      ex.qty++;
    } else {
      cart.push({ id: p.id, name: p.name, price: p.price, size: p.size, color: p.color, qty: 1, maxStock: p.stock });
    }
    renderCartUI();
  };

  window.updateCartQty = function(id, d) {
    const item = cart.find(x => x.id === id);
    if(!item) return;
    item.qty += d;
    if(item.qty <= 0) cart = cart.filter(x => x.id !== id);
    else if(item.qty > item.maxStock) item.qty = item.maxStock;
    renderCartUI();
  };

  window.setPayMethod = function(m) {
    selectedPayMethod = m;
    document.querySelectorAll('.pay-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === m));
    const box = $('trocoSection');
    if(box) {
      box.style.display = m === 'Dinheiro' ? 'block' : 'none';
      if(m === 'Dinheiro') calcularTroco();
    }
  };

  window.calcularTroco = function() {
    const total = cart.reduce((acc, x) => acc + (x.price * x.qty), 0);
    const rec = Number($('cashReceived')?.value) || 0;
    const disp = $('trocoDisplay');
    if(!disp) return;
    if(rec === 0) { disp.textContent = money(0); disp.style.color = 'var(--muted)'; return; }
    const diff = rec - total;
    if(diff < 0) { disp.textContent = `Falta ${money(Math.abs(diff))}`; disp.style.color = 'var(--red)'; }
    else { disp.textContent = money(diff); disp.style.color = 'var(--green)'; }
  };

  function renderCartUI() {
    const list = $('cartItemsList'), tot = $('cartGrandTotal');
    if(!list) return;
    if(cart.length === 0) { list.innerHTML = `<p class="muted" style="text-align:center;padding:20px">Carrinho vazio.</p>`; tot.textContent = money(0); calcularTroco(); return; }
    let total = 0;
    list.innerHTML = cart.map(i => {
      total += i.price * i.qty;
      return `
        <div class="cart-item">
          <div>
            <b>${esc(i.name)}</b><br><small style="color:var(--muted)">Tam: ${esc(i.size)} | Cor: ${esc(i.color)}</small><br>

            <button class="secondary" style="padding:2px 8px" onclick="updateCartQty('${i.id}',-1)">-</button>
            <span style="font-weight:700;width:20px;text-align:center">${i.qty}</span>
            <button class="secondary" style="padding:2px 8px" onclick="updateCartQty('${i.id}',1)">+</button>
          </div>
        </div>`;
    }).join('');
    tot.textContent = money(total);
    calcularTroco();
  }

  window.checkoutSale = async function() {
    if(cart.length === 0) return toast('O carrinho está vazio.');
    let total = cart.reduce((acc, x) => acc + (x.price * x.qty), 0);
    let rec = 0, troco = 0;
    if(selectedPayMethod === 'Dinheiro') {
      rec = Number($('cashReceived')?.value) || 0;
      if(rec > 0 && rec < total) return toast('Valor recebido inferior ao total!');
      troco = rec >= total ? rec - total : 0;
    }
    const saleData = { items: [...cart], total, paymentMethod: selectedPayMethod, cashReceived: rec, changeGiven: troco, cashier: currentUser.name, date: new Date().toISOString() };
    const refRes = await push(ref(db, 'sales'), saleData);
    for(let i of cart) {
      let p = productsCache.find(x => x.id === i.id);
      if(p) await update(ref(db, `products/${i.id}`), { stock: p.stock - i.qty });
    }
    const finishedCart = [...cart];
    cart = [];
    await renderPOS();
    showReceiptModal({ id: refRes.key, ...saleData, items: finishedCart });
  };

    $('modalRoot').innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:grid;place-items:center;padding:15px;z-index:99">
        <div id="printReceiptModal" style="background:#fff;width:min(380px,100%);padding:25px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.2);color:#1c2733">
          <div style="text-align:center;margin-bottom:15px">
            <h2 style="margin:0;font-size:20px;font-weight:800;text-transform:uppercase">${esc(appSettings.companyName)}</h2>
            <div style="font-size:12px;color:#667789;margin-top:2px">${esc(appSettings.topHeaderSuffix)}</div>
            <div style="font-size:11px;color:#667789;margin-top:6px">Data: ${dateStr}</div>
            <div style="font-size:11px;color:#667789">Operador: ${esc(sale.cashier)}</div>
          </div>
          <hr style="border:0;border-top:1px dashed #cbd5df;margin:12px 0">
          <div style="margin-bottom:12px">${itemsHtml}</div>
          <hr style="border:0;border-top:1px dashed #cbd5df;margin:12px 0">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Método:</span><b>${esc(sale.paymentMethod)}</b></div>
          ${payDet}
          <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-top:10px;padding-top:8px;border-top:1px solid #1c2733"><span>TOTAL:</span><span>${money(sale.total)}</span></div>
          <div style="text-align:center;margin-top:20px;font-size:11px;color:#667789">Obrigado pela preferência!<br>Volte sempre.</div>
          <div class="no-print" style="margin-top:20px;display:flex;gap:10px">
            <button type="button" class="secondary" style="flex:1;padding:10px" onclick="fecharModal()">Fechar</button>
            <button type="button" class="success" style="flex:1;padding:10px" onclick="window.print()">Imprimir</button>
          </div>
        </div>
      </div>`;
  };

  // HISTÓRICO E FECHO DE CAIXA
  async function loadSales() {
    const snap = await get(ref(db, 'sales'));
    salesCache = [];
    if(snap.exists()) snap.forEach(c => { salesCache.push({ id: c.key, ...c.val() }); });
  }

  window.changeReportFilter = async function(filterType) {
    currentReportFilter = filterType;
    await renderSalesHistory();
  };

  async function renderSalesHistory() {
    await loadSales();

    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const currentYear = now.getFullYear();
    const currentMonth = now.getMonth();

    const getWeekNumber = (d) => {
      d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
      let yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    };

    let filteredSales = salesCache.filter(s => {
      if(!s.date) return false;
      let sDate = new Date(s.date);
      let sDateStr = s.date.slice(0, 10);

      if(currentReportFilter === 'diario') {
        return sDateStr === todayStr;
      } else if(currentReportFilter === 'semanal') {
        return sDate.getFullYear() === currentYear && getWeekNumber(sDate) === getWeekNumber(now);
      } else if(currentReportFilter === 'mensal') {
        return sDate.getFullYear() === currentYear && sDate.getMonth() === currentMonth;
      } else if(currentReportFilter === 'anual') {
        return sDate.getFullYear() === currentYear;
      }
      return true;
    });

    filteredSales.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    let totalFaturado = filteredSales.reduce((acc, s) => acc + (s.total || 0), 0);
    let totalDinheiro = filteredSales.filter(s => s.paymentMethod === 'Dinheiro').reduce((acc, s) => acc + (s.total || 0), 0);
    let totalMpesa = filteredSales.filter(s => s.paymentMethod === 'M-Pesa').reduce((acc, s) => acc + (s.total || 0), 0);
    let totalEletronico = filteredSales.filter(s => s.paymentMethod !== 'Dinheiro').reduce((acc, s) => acc + (s.total || 0), 0);

    let reportTitles = {
      diario: 'Relatório Diário (Hoje)',
      semanal: 'Relatório Semanal (Esta Semana)',
      mensal: 'Relatório Mensal (Este Mês)',
      anual: 'Relatório Anual (Este Ano)'
    };

    let html = head('Histórico de Vendas e Fecho de Caixa');

    html += `
    <div class="panel" style="padding:15px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="font-weight:700;color:var(--navy)">Selecione o Tipo de Relatório:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="${currentReportFilter==='diario'?'':'secondary'}" style="padding:7px 14px;font-size:13px" onclick="changeReportFilter('diario')">📅 Diário</button>
        <button class="${currentReportFilter==='semanal'?'':'secondary'}" style="padding:7px 14px;font-size:13px" onclick="changeReportFilter('semanal')">📊 Semanal</button>
        <button class="${currentReportFilter==='mensal'?'':'secondary'}" style="padding:7px 14px;font-size:13px" onclick="changeReportFilter('mensal')">📈 Mensal</button>
        <button class="${currentReportFilter==='anual'?'':'secondary'}" style="padding:7px 14px;font-size:13px" onclick="changeReportFilter('anual')">🗓️ Anual</button>
      </div>
    </div>`;

    html += `
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:15px;margin-bottom:20px">
      <div class="panel" style="margin:0"><div class="muted">Total Faturado (${reportTitles[currentReportFilter]})</div><div style="font-size:22px;font-weight:800;color:var(--navy);margin-top:5px">${money(totalFaturado)}</div></div>
      <div class="panel" style="margin:0"><div class="muted">Dinheiro em Caixa</div><div style="font-size:20px;font-weight:800;color:var(--green);margin-top:5px">${money(totalDinheiro)}</div></div>
      <div class="panel" style="margin:0"><div class="muted">M-Pesa</div><div style="font-size:20px;font-weight:800;color:var(--blue);margin-top:5px">${money(totalMpesa)}</div></div>
      <div class="panel" style="margin:0"><div class="muted">Outros (e-Mola / mKesh)</div><div style="font-size:20px;font-weight:800;color:var(--orange);margin-top:5px">${money(totalEletronico - totalMpesa)}</div></div>
    </div>`;

    html += `
    <div class="panel">
      <h3>${reportTitles[currentReportFilter]} — Transações (${filteredSales.length})</h3>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>Data / Hora</th><th>Operador</th><th>Itens Vendidos</th><th>Método</th><th>Total</th><th>Ações</th></tr>
          </thead>
          <tbody>`;

    if(filteredSales.length === 0) {
      html += `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:30px">Nenhuma venda registada para este período.</td></tr>`;
    } else {
      filteredSales.forEach(s => {
        let dataFmt = new Date(s.date).toLocaleString('pt-MZ');
        let itensStr = (s.items || []).map(i => `${i.qty}x ${i.name} (${i.size}, ${i.color})`).join('<br>');
        html += `
          <tr>
            <td><small>${dataFmt}</small></td>
            <td><b>${esc(s.cashier)}</b></td>
            <td><div style="font-size:13px">${itensStr}</div></td>
            <td><span style="background:#eef4fc;padding:4px 8px;border-radius:4px;font-weight:600">${esc(s.paymentMethod)}</span></td>
            <td><b style="color:var(--green)">${money(s.total)}</b></td>
            <td><button class="secondary" style="padding:5px 10px;font-size:11px" onclick='showReceiptModal(${JSON.stringify(s)})'>🖨️ Reimprimir</button></td>
          </tr>`;
      });
    }

    html += `</tbody></table></div></div>`;
    $('contentArea').innerHTML = html;
  }

  async function renderDashboard() {
    await loadProducts();
    await loadSales();
    await updatePendingBadge();
    let lowStockCount = productsCache.filter(p => p.stock <= 3).length;
    let totalVendasHoje = salesCache.reduce((acc, s) => acc + (s.total || 0), 0);

    $('contentArea').innerHTML = head('Visão Geral') + `
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:15px;margin-bottom:20px">
        <div class="panel" style="margin:0"><div class="muted">Total de Artigos Cadastrados</div><div style="font-size:24px;font-weight:800;color:var(--navy);margin-top:5px">${productsCache.length}</div></div>
        <div class="panel" style="margin:0"><div class="muted">Faturamento Total Registado</div><div style="font-size:22px;font-weight:800;color:var(--green);margin-top:5px">${money(totalVendasHoje)}</div></div>
        <div class="panel" style="margin:0"><div class="muted">Alertas de Stock Baixo</div><div style="font-size:22px;font-weight:800;color:${lowStockCount>0?'var(--red)':'var(--green)'};margin-top:5px">${lowStockCount} artigos</div></div>
      </div>
      <div class="panel"><h3>Bem-vindo ao ${esc(appSettings.companyName)}</h3><p class="muted">O sistema está completo. Pode usar o menu lateral para gerir o Caixa, Stock, Histórico de Vendas com os 4 tipos de relatórios, Caixas e Definições.</p></div>`;
  }
</script>
</body>
</html>
